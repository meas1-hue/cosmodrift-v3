  // ==================== RUNNER OBSTACLE SPAWN ====================
  function getObstaclePool(diff) {
    var base = ['ASTEROID_LOW','ASTEROID_LOW','ASTEROID_MED','METEOR','SPACE_DEBRIS'];
    if (diff >= 1.3) base.push('SATELLITE');
    if (diff >= 1.6) base.push('CRUISER');
    if (diff >= 2.0) base.push('WORMHOLE');
    return base;
  }
  function spawnRunnerObstacle() {
    var pool = getObstaclePool(difficultyMult);
    var type = pool[Math.floor(Math.random()*pool.length)];
    var def = OBSTACLE_TYPES[type];
    var yPos;
    if (def.groundAnchored) yPos = SHIP_REST_Y - def.h + 8;
    else if (def.floatY === 'mid') yPos = 200+Math.random()*180;
    else yPos = 60+Math.random()*120;
    var hasPixels = (type==='ASTEROID_LOW'||type==='ASTEROID_MED'||type==='METEOR'||type==='SPACE_DEBRIS');
    runnerObstacles.push({ type:type, x:W+10, y:yPos, w:def.w, h:def.h, speed:getScrollSpeed(), rotation:0, rotSpeed:(Math.random()-0.5)*2, scored:false, pixels:hasPixels?generateRockPixels(def.w,def.h):null });
  }
  function getScrollSpeed() {
    return DRIFT_BASE_SPEED+(difficultyMult-1)*(DRIFT_MAX_SPEED-DRIFT_BASE_SPEED)*0.5;
  }

  // ==================== RUNNER COLLISION ====================
  function checkRunnerCollisions() {
    var now = performance.now()/1000;
    if (invincibleUntil > now) return;
    var sx = ship.x, sy = ship.y;
    var shipW = SHIP_GRID_W*SHIP_PX, shipH = SHIP_GRID_H*SHIP_PX;
    var sw = shipW*0.4, sh = shipH*0.4;
    for (var i = 0; i < runnerObstacles.length; i++) {
      var o = runnerObstacles[i];
      var ox = o.x+o.w*0.5, oy = o.y+o.h*0.5;
      var hw = o.w*0.4, hh = o.h*0.4;
      if (Math.abs(sx-ox) < sw+hw && Math.abs(sy-oy) < sh+hh) { takeDamage(); return; }
      if (!o.scored && o.x+o.w < ship.x-shipW*0.5) { o.scored=true; score+=OBSTACLE_TYPES[o.type].points; }
    }
  }

  // ==================== UPDATE RUNNER OBSTACLES ====================
  function updateRunnerObstacles(dt) {
    runnerSpawnTimer += dt;
    var interval = Math.max(RUNNER_SPAWN_MIN_GAP, RUNNER_SPAWN_INTERVAL_BASE/difficultyMult);
    if (runnerSpawnDelay > 0) { runnerSpawnDelay -= dt; }
    else if (runnerSpawnTimer >= interval) { runnerSpawnTimer = 0; spawnRunnerObstacle(); }
    for (var i = runnerObstacles.length-1; i >= 0; i--) {
      var o = runnerObstacles[i];
      o.x -= o.speed*dt; o.rotation += o.rotSpeed*dt;
      if (o.x+o.w < -20) runnerObstacles.splice(i,1);
    }
  }

  // ==================== DRAW RUNNER OBSTACLES ====================
  function drawRunnerObstacles() {
    for (var i = 0; i < runnerObstacles.length; i++) {
      var o = runnerObstacles[i];
      var drawFn = OBSTACLE_TYPES[o.type].draw;
      if (drawFn === 'drawRockObstacle') drawRockObstacle(o);
      else if (drawFn === 'drawMeteor') drawMeteor(o);
      else if (drawFn === 'drawDebris') drawDebris(o);
      else if (drawFn === 'drawCruiser') drawCruiser(o);
      else if (drawFn === 'drawSatellite') drawSatellite(o);
      else if (drawFn === 'drawWormhole') drawWormhole(o);
    }
  }


  // ==================== JUNGLE ENVIRONMENT ====================

  function initJungle() {
    jungleScroll = 0;
    jungleTrees = initJungleTrees();
    jungleCreatures = [];
    nextCreatureTimer = 5 + Math.random() * 8;
  }

  // Standalone sky — shared by the landing cinematic and the planet runner
  function drawJungleSky() {
    // Rich layered sky
    const sg = ctx.createLinearGradient(0, 0, 0, H * 0.7);
    sg.addColorStop(0,    '#0a1a2a');  // deep space blue-black at top
    sg.addColorStop(0.25, '#1a3a4a');  // dark teal
    sg.addColorStop(0.55, '#2a6a3a');  // jungle green mid
    sg.addColorStop(0.8,  '#6a9a2a');  // warm yellow-green
    sg.addColorStop(1,    '#9acc44');  // bright horizon
    ctx.fillStyle = sg;
    ctx.fillRect(0, 0, W, H * 0.7);
  }

  function drawJungle(dt, time) {
    jungleScroll += 80 * dt;
    const t2 = time;

    // 1. Sky
    drawJungleSky();

    // Two small alien suns
    const sun1x = ((W * 0.7 - jungleScroll * 0.01) % (W + 100) + W + 100) % (W + 100) - 50;
    drawPixelSun(sun1x, 60, 18, '#ffffaa', '#ffee44');
    const sun2x = ((W * 0.25 - jungleScroll * 0.008) % (W + 100) + W + 100) % (W + 100) - 50;
    drawPixelSun(sun2x, 80, 12, '#ddaaff', '#aa66ff');

    // 2. Far mountains (0.15x parallax)
    drawJungleMountains(jungleScroll * 0.15);

    // 2b. Giant alien trees — deep background (0.2x), darker and slower
    drawJungleDeepBackground(jungleScroll * 0.2);

    // 3. Mid trees + alien structures (0.4x)
    drawJungleMidLayer(jungleScroll * 0.4, t2);

    // 3b. Atmospheric haze / rising mist
    drawJungleHaze(jungleScroll);

    // 4. Foreground foliage (0.85x)
    drawJungleForeground(jungleScroll * 0.85, t2);

    // 5. Ground band
    drawJungleGround();

    // 5b. Bioluminescent mushrooms + spore mist
    drawBioGlow(jungleScroll * 1.1);

    // Atmospheric creatures
    updateAndDrawJungleCreatures(dt, t2);
  }

  // Atmospheric haze layers — mist rising from the jungle floor
  function drawJungleHaze(scrollX) {
    const hazeColors = [
      'rgba(80,180,100,0.08)',
      'rgba(120,200,80,0.06)',
      'rgba(180,220,100,0.05)'
    ];
    for (let i = 0; i < 3; i++) {
      const baseY = H * (0.45 + i * 0.08);
      const waveOffset = Math.sin(time * 0.3 + i * 2.1) * 8;
      ctx.fillStyle = hazeColors[i];
      ctx.beginPath();
      ctx.moveTo(0, baseY);
      for (let x = 0; x <= W; x += 20) {
        const y = baseY + Math.sin(x * 0.02 + scrollX * 0.001 + i) * 12 + waveOffset;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H); ctx.lineTo(0, H);
      ctx.closePath(); ctx.fill();
    }
  }

  // Bioluminescent ground effects — glowing mushrooms + spore mist
  function drawBioGlow(scrollX) {
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    const gy = CHAR_GROUND_Y;

    // Glowing mushroom clusters
    for (let i = 0; i < 6; i++) {
      const mx = ((i * 160 + 30 - scrollX * 1.1) % (W + 100) + W + 100) % (W + 100) - 50;
      const pulse = 0.5 + 0.5 * Math.sin(time * 2.5 + i * 1.3);
      const colors = ['#88ffcc', '#ffaa44', '#aa88ff', '#44ffff'];
      const col = colors[i % colors.length];

      // Cap
      ctx.fillStyle = col;
      ctx.globalAlpha = 0.7 + 0.3 * pulse;
      ctx.fillRect(Math.round(mx) - 8, gy - 20, 16, 10);
      ctx.fillRect(Math.round(mx) - 5, gy - 10, 10, 10);
      // Glow underneath
      ctx.globalAlpha = 0.3 * pulse;
      ctx.fillStyle = col;
      for (let r = 1; r <= 3; r++) {
        ctx.fillRect(Math.round(mx) - 8 - r * 2, gy - 20 - r, 16 + r * 4, 10 + r * 2);
      }
    }

    // Ground-level spore mist — fast small particles
    ctx.globalAlpha = 1;
    for (let i = 0; i < 12; i++) {
      const px = ((i * 55 + time * 15) % W + W) % W;
      const py = gy - 5 - Math.sin(time * 1.5 + i) * 8;
      const sa = 0.15 + 0.1 * Math.sin(time * 3 + i * 2);
      ctx.fillStyle = `rgba(150,255,120,${sa})`;
      ctx.fillRect(Math.round(px), Math.round(py), 2, 2);
    }

    ctx.restore();
  }

  // Giant alien trees far in the background — dark, slow, majestic
  function drawJungleDeepBackground(scrollX) {
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    for (let i = 0; i < 6; i++) {
      const tx = ((i * 200 + 50 - scrollX) % (W + 300) + W + 300) % (W + 300) - 150;
      const th = 200 + i * 30;
      // Massive trunk
      ctx.fillStyle = 'rgba(15,35,20,0.85)';
      ctx.fillRect(Math.round(tx) - 15, CHAR_GROUND_Y - th, 30, th);
      // Canopy — huge dark mass
      ctx.fillStyle = 'rgba(20,50,25,0.8)';
      ctx.beginPath();
      ctx.arc(tx, CHAR_GROUND_Y - th, 70 + i * 10, 0, Math.PI * 2);
      ctx.fill();
      // Bioluminescent patches on the canopy
      const gp = 0.3 + 0.2 * Math.sin(time * 0.8 + i);
      ctx.fillStyle = `rgba(60,200,80,${gp})`;
      ctx.fillRect(Math.round(tx) - 10, CHAR_GROUND_Y - th - 20, 20, 15);
      ctx.fillRect(Math.round(tx) + 20, CHAR_GROUND_Y - th + 10, 15, 10);
    }
    ctx.restore();
  }

  function drawPixelSun(cx, cy, r, colorOuter, colorInner) {
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.5);
    g.addColorStop(0, colorInner + 'aa');
    g.addColorStop(1, colorOuter + '00');
    ctx.fillStyle = g;
    ctx.fillRect(cx - r * 3, cy - r * 3, r * 6, r * 6);
    var key = r + '|' + colorInner;
    if (!sunBodyCache[key]) {
      var size = r * 2 + 2;
      var sc = document.createElement('canvas');
      sc.width = size; sc.height = size;
      var sctx = sc.getContext('2d');
      sctx.imageSmoothingEnabled = false;
      for (var spy = -r; spy <= r; spy++) {
        for (var spx = -r; spx <= r; spx++) {
          if (spx * spx + spy * spy <= r * r) {
            var slit = 1 - (spx * 0.3 + spy * 0.3) / (r * 1.5);
            sctx.fillStyle = slit > 0.6 ? colorInner : colorOuter;
            sctx.fillRect(Math.round(spx + r + 1), Math.round(spy + r + 1), 1, 1);
          }
        }
      }
      sunBodyCache[key] = sc;
    }
    ctx.drawImage(sunBodyCache[key], Math.round(cx - r - 1), Math.round(cy - r - 1));
    ctx.restore();
  }

  function drawJungleMountains(scrollX) {
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    for (let layer = 0; layer < 2; layer++) {
      const baseY = H * (0.35 + layer * 0.08);
      const alpha = 0.3 + layer * 0.2;
      const color = layer === 0 ? 'rgba(40,80,60,' + alpha + ')' : 'rgba(50,100,70,' + alpha + ')';
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, H);
      const seed = layer * 999;
      const spacing = 80;
      const numPeaks = Math.ceil(W / spacing) + 4;
      const offset = scrollX % spacing;
      ctx.lineTo(-offset, H);
      for (let i = 0; i < numPeaks; i++) {
        const px = i * spacing - offset;
        const h = 80 + Math.sin((i + seed) * 1.7) * 50 + Math.sin((i + seed) * 0.9) * 30;
        ctx.lineTo(px - spacing * 0.5, baseY);
        ctx.lineTo(px - spacing * 0.25, baseY - h);
        ctx.lineTo(px, baseY);
      }
      ctx.lineTo(W + spacing, H);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function initStaticCanvases() {
    vignetteCanvas = document.createElement('canvas');
    vignetteCanvas.width = W; vignetteCanvas.height = H;
    var vc = vignetteCanvas.getContext('2d');
    var vg = vc.createRadialGradient(W/2,H/2,W*0.15,W/2,H/2,W*0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(0.4, 'rgba(0,0,0,0.05)');
    vg.addColorStop(0.7, 'rgba(0,0,0,0.28)');
    vg.addColorStop(1, 'rgba(0,0,0,0.72)');
    vc.fillStyle = vg;
    vc.fillRect(0, 0, W, H);

    bgCanvas = document.createElement('canvas');
    bgCanvas.width = W; bgCanvas.height = H;
    var bc = bgCanvas.getContext('2d');
    var bg = bc.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#060a1a');
    bg.addColorStop(0.5, '#030812');
    bg.addColorStop(1, '#020510');
    bc.fillStyle = bg;
    bc.fillRect(0, 0, W, H);
  }

  function buildCanopyCanvas(cr) {
    var cs = cr * 2 + 4;
    var tc = document.createElement('canvas');
    tc.width = cs; tc.height = cs;
    var tctx = tc.getContext('2d');
    tctx.imageSmoothingEnabled = false;
    for (var py = -cr; py <= cr; py += 3) {
      for (var px = -cr; px <= cr; px += 3) {
        if (px * px + py * py > cr * cr) continue;
        var edge = Math.sqrt(px * px + py * py) / cr;
        var hue = 110 + Math.sin(px * 0.3 + py * 0.2) * 10;
        var lit = 35 + (1 - edge) * 15 + (py < 0 ? 5 : 0);
        tctx.fillStyle = 'hsl(' + hue + ',65%,' + lit + '%)';
        tctx.fillRect(Math.round(px + cr + 2), Math.round(py + cr + 2), 3, 3);
      }
    }
    return tc;
  }

  function initJungleTrees() {
    const trees = [];
    for (let i = 0; i < 12; i++) {
      const cr = Math.round(40 + Math.random() * 30);
      trees.push({
        x: i * 120 + Math.random() * 60,
        baseX: i * 120 + Math.random() * 60,
        h: 140 + Math.random() * 80,
        w: 30 + Math.random() * 20,
        canopyR: cr,
        colorTrunk: 'hsl(' + (100 + Math.random() * 30) + ',' + (40 + Math.random() * 20) + '%,' + (25 + Math.random() * 10) + '%)',
        colorLeaf: 'hsl(' + (110 + Math.random() * 40) + ',' + (60 + Math.random() * 20) + '%,' + (35 + Math.random() * 15) + '%)',
        glowColor: Math.random() > 0.5 ? '#aaff88' : '#88ffaa',
        fruits: Array.from({ length: 3 + Math.floor(Math.random() * 4) }, () => ({
          angle: Math.random() * Math.PI * 2,
          dist: 20 + Math.random() * 20,
          color: Math.random() > 0.5 ? '#ff8844' : '#ffdd22'
        })),
        floatTimer: Math.random() * Math.PI * 2,
        canopyCanvas: buildCanopyCanvas(cr),
        canopyOff: cr + 2
      });
    }
    return trees;
  }

  function drawJungleMidLayer(scrollX, t2) {
    ctx.save();
    ctx.imageSmoothingEnabled = false;

    for (const tree of jungleTrees) {
      const tx = ((tree.baseX - scrollX) % (W + 300) + W + 300) % (W + 300) - 150;
      const ty = CHAR_GROUND_Y;
      const float = Math.sin(t2 * 0.5 + tree.floatTimer) * 3;

      // Trunk — pixel rectangle
      ctx.fillStyle = tree.colorTrunk;
      ctx.fillRect(Math.round(tx - tree.w / 2), Math.round(ty - tree.h), tree.w, tree.h);

      // Canopy — pre-rendered offscreen canvas
      const cr = tree.canopyR;
      const cy2 = ty - tree.h + float;
      if (tree.canopyCanvas) {
        ctx.drawImage(tree.canopyCanvas, Math.round(tx - tree.canopyOff), Math.round(cy2 - tree.canopyOff));
      }

      // Glowing fruits
      const fruitPulse = 0.7 + 0.3 * Math.sin(t2 * 2 + tree.floatTimer);
      ctx.shadowColor = tree.glowColor;
      ctx.shadowBlur = 6;
      for (const f of tree.fruits) {
        const fx = tx + Math.cos(f.angle) * f.dist;
        const fy = cy2 + Math.sin(f.angle) * f.dist * 0.6;
        ctx.fillStyle = f.color;
        ctx.globalAlpha = fruitPulse;
        ctx.fillRect(Math.round(fx) - 3, Math.round(fy) - 3, 6, 6);
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      // Floating alien structure (every 4th tree)
      if (Math.round(tree.baseX / 120) % 4 === 0) {
        const sx = tx + 60, sy = ty - tree.h - 40;
        ctx.fillStyle = 'rgba(60,80,100,0.7)';
        ctx.fillRect(Math.round(sx - 15), Math.round(sy - 20), 30, 20);
        ctx.fillRect(Math.round(sx - 8), Math.round(sy - 30), 16, 12);
        ctx.fillStyle = 'rgba(150,220,255,' + (0.4 + 0.3 * Math.sin(t2 * 1.5 + tree.floatTimer)) + ')';
        ctx.fillRect(Math.round(sx - 5), Math.round(sy - 15), 10, 6);
      }
    }
    ctx.restore();
  }

  function drawJungleForeground(scrollX, t2) {
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    for (let i = 0; i < 8; i++) {
      const fx = ((i * 180 + 40 - scrollX) % (W + 200) + W + 200) % (W + 200) - 100;
      const fy = CHAR_GROUND_Y - 20;
      const swing = Math.sin(t2 * 1.2 + i) * 4;
      ctx.fillStyle = 'hsl(' + (115 + i * 5) + ',70%,' + (22 + i % 3 * 5) + '%)';
      for (let l = 0; l < 5; l++) {
        const la = (l / 5) * Math.PI - Math.PI * 0.25 + swing * 0.05;
        const lx = fx + Math.cos(la) * 30;
        const ly = fy + Math.sin(la) * 20;
        ctx.fillRect(Math.round(lx) - 4, Math.round(ly) - 2, 8 + i % 3 * 2, 4);
      }
      if (i % 2 === 0) {
        ctx.fillStyle = 'rgba(150,255,120,' + (0.3 + 0.2 * Math.sin(t2 * 3 + i)) + ')';
        ctx.fillRect(Math.round(fx + 10), Math.round(fy - 15), 3, 3);
      }
    }
    ctx.restore();
  }

  function drawJungleGround() {
    const gy = CHAR_GROUND_Y;
    ctx.fillStyle = '#2a4a1a';
    ctx.fillRect(0, gy, W, H - gy);
    for (let x = 0; x < W; x += 6) {
      const shade = 30 + Math.floor(Math.sin(x * 0.3 + time * 0.5) * 8);
      ctx.fillStyle = 'rgb(' + (30 + shade % 10) + ',' + (shade + 30) + ',' + (15 + shade % 5) + ')';
      ctx.fillRect(x, gy, 5, 4);
    }
    ctx.fillStyle = 'rgba(100,255,80,' + (0.3 + 0.15 * Math.sin(time * 2)) + ')';
    for (let x = 20; x < W; x += 35) {
      ctx.fillRect(x + Math.floor(Math.sin(x) * 5), gy + 1, 2, 2);
    }
  }

  function updateAndDrawJungleCreatures(dt, t2) {
    nextCreatureTimer -= dt;
    if (nextCreatureTimer <= 0) {
      jungleCreatures.push({
        x: W + 50,
        y: CHAR_GROUND_Y - 80 - Math.random() * 120,
        speed: 15 + Math.random() * 25,
        type: Math.floor(Math.random() * 3),
        bobOffset: Math.random() * Math.PI * 2,
        color: 'hsl(' + (60 + Math.random() * 120) + ',70%,50%)'
      });
      nextCreatureTimer = 6 + Math.random() * 10;
    }

    ctx.save();
    ctx.imageSmoothingEnabled = false;
    for (let i = jungleCreatures.length - 1; i >= 0; i--) {
      const c = jungleCreatures[i];
      c.x -= c.speed * dt;
      if (c.x < -100) { jungleCreatures.splice(i, 1); continue; }

      const bob = Math.sin(t2 * 1.5 + c.bobOffset) * 5;
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = c.color;

      if (c.type === 0) {
        ctx.fillRect(Math.round(c.x) - 10, Math.round(c.y + bob) - 12, 20, 20);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.round(c.x) - 6, Math.round(c.y + bob) - 8, 5, 5);
        ctx.fillRect(Math.round(c.x) + 2, Math.round(c.y + bob) - 8, 5, 5);
        ctx.fillStyle = '#111';
        ctx.fillRect(Math.round(c.x) - 5, Math.round(c.y + bob) - 7, 3, 3);
        ctx.fillRect(Math.round(c.x) + 3, Math.round(c.y + bob) - 7, 3, 3);
      } else if (c.type === 1) {
        ctx.fillRect(Math.round(c.x) - 5, Math.round(c.y + bob) - 30, 10, 35);
        ctx.fillRect(Math.round(c.x) - 10, Math.round(c.y + bob) - 42, 20, 16);
      } else {
        ctx.fillRect(Math.round(c.x) - 8, Math.round(c.y + bob) - 15, 16, 12);
        for (let t3 = 0; t3 < 4; t3++) {
          ctx.fillRect(Math.round(c.x) - 6 + t3 * 4, Math.round(c.y + bob) - 3 + Math.sin(t2 * 3 + t3) * 4, 2, 10);
        }
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ==================== MOON ENVIRONMENT FUNCTIONS ====================

  // ==================== SHIP DRAW ====================
  function drawShip(cx, cy, angle, opacity, isMenu) {
    angle = angle || 0;
    opacity = (opacity === undefined) ? 1 : opacity;

    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.imageSmoothingEnabled = false;

    ctx.translate(Math.round(cx), Math.round(cy));
    ctx.rotate(angle);

    // Velocity-based tilt (skip if manual angle provided)
    if (angle === 0 && typeof ship !== 'undefined') {
      var tilt = Math.max(-0.35, Math.min(0.35, (ship.vy || 0) * 0.0007));
      ctx.rotate(tilt);
    }

    var t2 = performance.now() * 0.001;
    var pulse = 0.55 + 0.45 * Math.sin(t2 * 5.5);
    var thrustPower = (typeof ship !== 'undefined' && ship.vy < -50) ? 1.0 : 0.4;

    // 1. Thruster glow beneath — animated, grows with thrust
    var thrustSize = 14 + thrustPower * 18;
    var tg = ctx.createRadialGradient(0, 8, 0, 0, 10, thrustSize);
    tg.addColorStop(0, 'rgba(100,200,255,' + (0.7 * pulse * thrustPower) + ')');
    tg.addColorStop(0.4, 'rgba(60,140,255,' + (0.4 * thrustPower) + ')');
    tg.addColorStop(1, 'rgba(60,140,255,0)');
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.ellipse(0, 10, thrustSize, thrustSize * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // 2. Draw pixel grid
    var gW = SHIP_PIXELS[0].length, gH = SHIP_PIXELS.length;
    var oX = -Math.floor(gW * SHIP_PX / 2), oY = -Math.floor(gH * SHIP_PX / 2);

    for (var r = 0; r < gH; r++) {
      for (var c = 0; c < gW; c++) {
        var ch = SHIP_PIXELS[r][c];
        if (!ch || ch === '.') continue;
        var color;
        if (ch === 'D') color = '#3a3f47';
        else if (ch === 'G') color = '#8a9aa8';
        else if (ch === 'L') color = '#c8d0d8';
        else if (ch === 'W') color = '#eef2f5';
        else if (ch === 'C') color = '#80d4ee';
        else if (ch === 'Y') color = 'rgba(255,' + (180 + Math.floor(pulse * 75)) + ',50,' + (0.7 + pulse * 0.3) + ')';
        else if (ch === 'T') color = 'rgba(48,' + (140 + Math.floor(pulse * 60)) + ',204,' + (0.6 + pulse * 0.4) + ')';
        else if (ch === 'S') color = '#5a6a78';
        else continue;
        ctx.fillStyle = color;
        ctx.fillRect(oX + c * SHIP_PX, oY + r * SHIP_PX, SHIP_PX, SHIP_PX);
      }
    }

    // 3. Dome lens flare — small bright pixel that moves slightly
    var flareX = oX + Math.floor(gW * 0.35) * SHIP_PX + Math.floor(Math.sin(t2 * 0.7) * 2);
    var flareY = oY + Math.floor(gH * 0.2) * SHIP_PX;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillRect(flareX, flareY, 2, 2);

    // 4. Running light glow halo
    ctx.shadowColor = '#ffcc44';
    ctx.shadowBlur = 8 * pulse;
    ctx.fillStyle = 'rgba(255,200,50,' + (pulse * 0.8) + ')';
    ctx.fillRect(oX + 2, oY + Math.floor(gH * 0.6) * SHIP_PX, 2, 2);
    ctx.fillRect(oX + (gW - 2) * SHIP_PX - 2, oY + Math.floor(gH * 0.6) * SHIP_PX, 2, 2);
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  // ==================== CHARACTER STATE SYSTEM ====================
  // Planet runner character state machine

  function setCharState(newState) {
    if (char.state === newState) return;
    char.state = newState;
    char.animFrame = 0;
    char.animTimer = 0;
    char.stateTimer = 0;
  }

  function updateCharacterAnim(dt) {
    const anim = CHAR_ANIMS[char.state];
    if (!anim) return;
    char.animTimer += dt;
    const frameDur = 1 / anim.fps;
    if (char.animTimer >= frameDur) {
      char.animTimer = 0;
      char.animFrame++;
      if (char.animFrame >= anim.frames.length) {
        if (anim.loop) {
          char.animFrame = 0;
        } else {
          char.animFrame = anim.frames.length - 1;
          if (char.state === 'land')     setCharState('run');
          if (char.state === 'fire')     setCharState(char.onGround ? 'run' : 'jump');
          if (char.state === 'hurt')     setCharState(char.onGround ? 'run' : 'jump');
          if (char.state === 'air_dive') { char.y = CHAR_GROUND_Y; char.vy = 0; char.onGround = true; char.jumpsUsed = 0; setCharState('land'); }
        }
      }
    }
  }

  function drawCharacter() {
    // Guard 1: sprites must be loaded — draw a placeholder so she's always visible
    if (!spritesLoaded) {
      ctx.fillStyle = '#ff00ff';
      ctx.fillRect(CHAR_X - 20, char.y - 120, 40, 120);
      return;
    }

    const anim = CHAR_ANIMS[char.state];
    if (!anim) return;
    const frameName = anim.frames[Math.min(char.animFrame, anim.frames.length - 1)];

    // Guard 2: resolve the sprite, falling back to a standing/run frame if missing
    const sp = sprites[frameName] || sprites['hurt'] || sprites['run2'];
    if (!sp || !sp.width || !sp.height) {
      // Last-resort fallback so the player can still see the character
      ctx.fillStyle = '#ff8800';
      ctx.fillRect(CHAR_X - 20, char.y - 120, 40, 120);
      return;
    }

    // Size by pose height, preserve the cropped aspect ratio, and anchor her
    // feet (the bottom of the cropped sprite) to the ground line at char.y.
    const dh = CHAR_STATE_HEIGHT[char.state] || 132;
    const dw = dh * (sp.width / sp.height);
    const dx = CHAR_X - dw * 0.5;
    const dy = char.y - dh;

    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // Blink when invincible
    if (charInvincible > 0 && Math.floor(time * 8) % 2 === 0) {
      ctx.globalAlpha = 0.4;
    }

    ctx.drawImage(sp, dx, dy, dw, dh);
    ctx.restore();
  }

  function updateCharacter(dt) {
    char.stateTimer += dt;

    if (char.shootCooldown > 0) char.shootCooldown -= dt;

    // Physics
    if (!char.onGround) {
      char.vy += CHAR_GRAVITY * dt;
      char.y  += char.vy * dt;
    }

    // Floor
    if (char.y >= CHAR_GROUND_Y) {
      char.y = CHAR_GROUND_Y;
      const wasAirborne = !char.onGround;
      char.onGround = true;
      char.jumpsUsed = 0;
      char.isSliding = false;
      if (wasAirborne && char.state !== 'land' && char.state !== 'air_dive') {
        setCharState('land');
      }
    }

    // Slide timer
    if (char.isSliding) {
      char.slideTimer -= dt;
      if (char.slideTimer <= 0) {
        char.isSliding = false;
        setCharState('run');
      }
    }

    // Auto-state: if on ground and no special state, run
    const specialStates = ['slide','land','hurt','death','fire','aim'];
    if (char.onGround && !char.isSliding && !specialStates.includes(char.state)) {
      if (char.state !== 'run') setCharState('run');
    }
    if (!char.onGround && char.state === 'run') setCharState('jump');

    updateCharacterAnim(dt);
  }

  function charJump() {
    if (char.state === 'death') return;
    if (char.jumpsUsed === 0) {
      char.vy = CHAR_JUMP_V1;
      char.onGround = false;
      char.isSliding = false;
      char.jumpsUsed = 1;
      setCharState('jump');
    } else if (char.jumpsUsed === 1) {
      char.vy = CHAR_JUMP_V2;
      char.jumpsUsed = 2;
      setCharState('roll');
    }
  }

  function charSlideOrDive() {
    if (char.state === 'death') return;
    if (char.onGround && !char.isSliding) {
      char.isSliding = true;
      char.slideTimer = CHAR_SLIDE_DURATION;
      setCharState('slide');
    } else if (!char.onGround && char.jumpsUsed === 1) {
      char.vy = 900; // fast fall
      setCharState('air_dive');
    }
  }

  // One input = one shot. A short cooldown prevents machine-gun spam but lets
  // the player fire as fast as they can sensibly tap/swipe.
  function charShoot() {
    if (char.state === 'death') return;
    if (char.shootCooldown > 0) return;
    fireLaserBeam();
    char.shootCooldown = 0.32;
    setCharState('fire');
  }

  function fireLaserBeam() {
    const beamY = char.isSliding
      ? char.y - 26
      : char.y - 78;
    laserBeams.push({
      x: CHAR_X + 60,
      y: beamY,
      speed: 700,
      life: 1.2
    });
  }

  function updateLaserBeams(dt) {
    for (let i = laserBeams.length-1; i >= 0; i--) {
      const b = laserBeams[i];
      b.x += b.speed * dt;
      b.life -= dt;
      if (b.life <= 0 || b.x > W + 50) laserBeams.splice(i, 1);
    }
  }

  function drawLaserBeams() {
    for (const b of laserBeams) {
      const alpha = Math.min(1, b.life * 3);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.shadowColor = '#00eeff';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#00ccff';
      ctx.fillRect(b.x - 30, b.y - 3, 40, 6);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(b.x - 20, b.y - 1, 25, 2);
      if (b.life > 1.0) {
        ctx.fillStyle = 'rgba(255,150,0,' + (b.life - 1.0) * 10 + ')';
        ctx.fillRect(b.x - 35, b.y - 6, 8, 12);
      }
      ctx.restore();
    }
  }

  // ==================== THRUSTER PARTICLES ====================
  function spawnThrusterParticle(x, y) {
    if (thrusterParticles.length > 20) return;
    thrusterParticles.push({ x:x, y:y+SHIP_GRID_H*SHIP_PX/2+2, vx:(Math.random()-0.5)*20, vy:30+Math.random()*40, life:0.3+Math.random()*0.2, maxLife:0.5, size:1+Math.random()*2 });
  }
  function updateParticles(dt) {
    for (var i = thrusterParticles.length-1; i >= 0; i--) {
      var p = thrusterParticles[i];
      p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
      if (p.life <= 0) thrusterParticles.splice(i,1);
    }
  }
  function drawParticles() {
    ctx.imageSmoothingEnabled = false;
    for (var i = 0; i < thrusterParticles.length; i++) {
      var p = thrusterParticles[i];
      var alpha = p.life/p.maxLife, t2 = performance.now()*0.01;
      var r = Math.floor(100+155*alpha*(0.5+0.5*Math.sin(t2+i)));
      var g = Math.floor(180+75*alpha), b = Math.floor(255*alpha);
      ctx.fillStyle = 'rgba('+r+','+g+','+b+','+alpha+')';
      ctx.fillRect(Math.round(p.x), Math.round(p.y), Math.round(p.size), Math.round(p.size));
    }
  }

  // ==================== EXPLOSION PARTICLES ====================
  function spawnExplosion(x, y, count, color) {
    for (var i = 0; i < count; i++) {
      explosionParticles.push({ x:x, y:y, vx:(Math.random()-0.5)*200, vy:(Math.random()-0.5)*200, life:0.3+Math.random()*0.5, maxLife:0.8, size:1+Math.random()*3, color:color });
    }
  }
  function updateExplosionParticles(dt) {
    for (var i = explosionParticles.length-1; i >= 0; i--) {
      var p = explosionParticles[i];
      p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
      if (p.life <= 0) explosionParticles.splice(i,1);
    }
  }
  function drawExplosionParticles() {
    for (var i = 0; i < explosionParticles.length; i++) {
      var p = explosionParticles[i];
      var alpha = p.life/p.maxLife;
      ctx.globalAlpha = alpha; ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), Math.round(p.size), Math.round(p.size));
    }
    ctx.globalAlpha = 1;
  }

  // ==================== DAMAGE / LIVES ====================
  function takeDamage() {
    var now = performance.now()/1000;
    if (invincibleUntil > now) return;
    lives--; invincibleUntil = now+INVINCIBLE_DURATION;
    spawnExplosion(ship.x, ship.y, 15, '#ff6644');
    playSound('hit');
    if (lives <= 0) {
      gameState = STATE.GAME_OVER;
      if (score > highScore) { highScore = score; localStorage.setItem('cosmodrift_highscore', highScore.toString()); }
      spawnExplosion(ship.x, ship.y, 40, '#ffcc44');
      playSound('explosion');
    }
  }

  // ==================== DRIFT MODE UPDATE ====================
  function updateDrift(dt) {
    ship.vy += DRIFT_GRAVITY*dt;
    ship.vy = Math.min(ship.vy, DRIFT_MAX_VY);
    ship.y += ship.vy*dt;
    if (ship.y >= SHIP_REST_Y) { ship.y = SHIP_REST_Y; ship.vy = 0; ship.onGround = true; }
    else { ship.onGround = false; }
    if (ship.y <= SHIP_CEILING) { ship.y = SHIP_CEILING; takeDamage(); }
    updateRunnerObstacles(dt);
    checkRunnerCollisions();
    altDisplay = Math.max(0, Math.round(SHIP_REST_Y - ship.y));
  }

  // ==================== HUD ====================
  function drawHUD() {
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.lineWidth = 1;

    // Score panel
    ctx.fillStyle = 'rgba(0,6,18,0.62)';
    ctx.fillRect(6, 6, 126, 40);
    ctx.strokeStyle = 'rgba(0,180,255,0.22)';
    ctx.strokeRect(6, 6, 126, 40);
    ctx.font = '10px Orbitron, monospace'; ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(0,200,255,0.7)';
    ctx.fillText('SCORE', 12, 10);
    ctx.shadowColor = 'rgba(0,200,255,0.35)'; ctx.shadowBlur = 5;
    ctx.font = '16px Orbitron, monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(score, 12, 24);
    ctx.shadowBlur = 0;

    if (stage === STAGE.SPACE_RUNNER) {

      ctx.fillStyle = 'rgba(80,160,210,0.8)'; ctx.font = '9px Orbitron, monospace';

    if (stage === STAGE.SPACE_RUNNER) {

      ctx.fillStyle = 'rgba(0,6,18,0.55)';

    }

    // Lives — diamond pip icons top-right
    for (var i = 0; i < MAX_LIVES; i++) {
      var lx = W - 14 - i * 20, ly = 10;
      ctx.shadowColor = i < lives ? '#ff3300' : 'transparent';
      ctx.shadowBlur = i < lives ? 6 : 0;
      ctx.fillStyle = i < lives ? '#ff5533' : 'rgba(60,20,10,0.45)';

      ctx.fillRect(lx+1, ly+4, 4, 2);

// ==================== CRASH SEQUENCE ====================
  function startCrash() {
    crashTime = 0;
    crashSmoke = [];
    crashSparks = [];
    crashShake = 18;
    crashFlash = 1;
    crashMissile = { x: W + 40, y: 80, tx: ship.x, ty: ship.y };
    crashStarted = true;
  }

  function updateCrash(dt) {
    crashTime += dt;
    // Missile approach (0–1.2s)
    if (crashTime < 1.2 && crashMissile) {
      const p = crashTime / 1.2;
      crashMissile.x = (W + 40) + (ship.x - (W + 40)) * p;
      crashMissile.y = 80 + (ship.y - 80) * p;
      // Smoke trail from missile
      if (Math.random() < 0.6) crashSmoke.push({ x: crashMissile.x+6, y: crashMissile.y, vx: 20+Math.random()*20, vy: (Math.random()-0.5)*15, life: 0.8, max: 0.8, r: 4+Math.random()*3 });
    }
    // Impact (1.2s)
    if (crashTime >= 1.2 && crashMissile) {
      crashMissile = null;
      crashShake = 22;
      crashFlash = 1;
      // Brighter, larger spark burst — warm oranges + white core
      for (let i = 0; i < 60; i++) {
        const a = Math.random()*Math.PI*2, s = 100+Math.random()*220;
        crashSparks.push({ x: ship.x, y: ship.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1.0+Math.random()*0.4, max: 1.4, hue: Math.random()>0.5?'warm':'hot' });
      }
      // Extra sparks — bright white core
      for (let i = 0; i < 25; i++) {
        const a = Math.random()*Math.PI*2, s = 30+Math.random()*80;
        crashSparks.push({ x: ship.x, y: ship.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.5+Math.random()*0.3, max: 0.8, white: true });
      }
      // Ember particles — slow rising orange dots
      for (let i = 0; i < 15; i++) {
        crashSparks.push({ x: ship.x+(Math.random()-0.5)*20, y: ship.y, vx: (Math.random()-0.5)*40, vy: -20-Math.random()*40, life: 1.5+Math.random()*0.5, max: 2.0, ember: true });
      }
      playSound('explosion');
    }
    // Falling ship (1.2–5s): pull up then tumble down
    if (crashTime >= 1.2) {
      const t = crashTime - 1.2;
      if (t < 0.6) { ship.y -= 120 * dt; ship.vy = 0; }
      else { ship.vy += 600 * dt; ship.y += ship.vy * dt; }
      ship.angle = (ship.angle||0) + 3 * dt;
      // Thicker layered smoke from tumbling ship — increased spawn rate
      if (Math.random() < 0.95) crashSmoke.push({ x: ship.x+(Math.random()-0.5)*16, y: ship.y+(Math.random()-0.5)*12, vx: -15-Math.random()*35, vy: -8-Math.random()*25, life: 1.5+Math.random()*0.5, max: 2.0, r: 5+Math.random()*6 });
    }
    // decay
    crashShake *= 0.9;
    crashFlash *= 0.85;
    for (let i = crashSmoke.length-1; i>=0; i--){ const s=crashSmoke[i]; s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt; if(s.life<=0)crashSmoke.splice(i,1); }
    for (let i = crashSparks.length-1; i>=0; i--){ const s=crashSparks[i]; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=300*dt; s.life-=dt; if(s.life<=0)crashSparks.splice(i,1); }
    // End of crash → start landing cinematic
    if (crashTime >= CRASH_DURATION) {
      crashStarted = false;
      stage = STAGE.LANDING;
      landingTime = 0;
      landingShipY = -80;
      landingShipAngle = 0.3;
      landingPlanetScale = 0;
      landingSmoke = [];
      landingDustParticles = [];
      landingCameraShake = 0;
      // Jungle is initialized now so the landing scene can render it
      initJungle();
    }
  }

  function easeInOut(t) {
    return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
  }

  function updateLanding(dt) {
    landingTime += dt;

    // Ship descent path
    if (landingTime < LANDING_DURATION * 0.7) {
      const descP = landingTime / (LANDING_DURATION * 0.7);
      landingShipY = -80 + (CHAR_GROUND_Y - 60 - (-80)) * easeInOut(descP);
      landingShipAngle = 0.3 * (1 - descP); // straightens out
      // Continuous smoke during descent
      if (Math.random() < 0.7) {
        landingSmoke.push({
          x: W / 2 + (Math.random() - 0.5) * 20,
          y: landingShipY - 10,
          vx: (Math.random() - 0.5) * 30,
          vy: -15 - Math.random() * 20,
          life: 1.0, max: 1.0,
          r: 4 + Math.random() * 6
        });
      }
    } else if (landingTime < LANDING_DURATION * 0.75) {
      // Impact moment
      landingShipY = CHAR_GROUND_Y - 55;
      landingShipAngle = 0;
      if (landingCameraShake < 0.1) {
        landingCameraShake = 14;
        // Dust burst
        for (let i = 0; i < 30; i++) {
          const a = Math.PI + Math.random() * Math.PI;
          const s = 60 + Math.random() * 120;
          landingDustParticles.push({
            x: W / 2, y: CHAR_GROUND_Y,
            vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
            life: 1.2, max: 1.2
          });
        }
        if (typeof playSound === 'function') { try { playSound('explosion'); } catch (e) {} }
      }
    } else {
      landingShipY = CHAR_GROUND_Y - 55;
      landingShipAngle = 0;
    }

    landingCameraShake *= 0.88;

    // Update smoke
    for (let i = landingSmoke.length - 1; i >= 0; i--) {
      const s = landingSmoke[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      if (s.life <= 0) landingSmoke.splice(i, 1);
    }
    // Update dust
    for (let i = landingDustParticles.length - 1; i >= 0; i--) {
      const d = landingDustParticles[i];
      d.x += d.vx * dt; d.y += d.vy * dt;
      d.vy += 180 * dt; d.life -= dt;
      if (d.life <= 0) landingDustParticles.splice(i, 1);
    }

    // End landing → start planet runner
    if (landingTime >= LANDING_DURATION) {
      stage = STAGE.PLANET_RUNNER;
      initJungle();
      initPlanetRunner();
      char.y = CHAR_GROUND_Y;
      char.vy = 0; char.onGround = true;
      char.jumpsUsed = 0; char.isSliding = false;
      charInvincible = 2.0;
      setCharState('run');
    }
  }

  function renderLanding() {
    ctx.save();
    const sx = (Math.random() - 0.5) * landingCameraShake;
    const sy = (Math.random() - 0.5) * landingCameraShake;
    ctx.translate(sx, sy);

    // Jungle sky + far mountains as backdrop
    drawJungleSky();
    drawJungleMountains(landingTime * 20);

    // Planet surface rises from bottom as ship descends
    const surfaceP = Math.min(1, landingTime / (LANDING_DURATION * 0.5));
    const surfaceY = H - (H * 0.35 * surfaceP);
    const surfGrad = ctx.createLinearGradient(0, surfaceY, 0, H);
    surfGrad.addColorStop(0, '#3a7a2a');
    surfGrad.addColorStop(0.3, '#2a5a1a');
    surfGrad.addColorStop(1, '#1a3a0a');
    ctx.fillStyle = surfGrad;
    ctx.fillRect(0, surfaceY, W, H - surfaceY);

    // Ground texture on surface
    if (surfaceP > 0.3) {
      ctx.imageSmoothingEnabled = false;
      for (let x = 0; x < W; x += 6) {
        const sh = 30 + Math.floor(Math.sin(x * 0.3 + landingTime) * 8);
        ctx.fillStyle = `rgb(${30 + sh % 10},${sh + 30},${15 + sh % 5})`;
        ctx.fillRect(x, Math.round(surfaceY), 5, 4);
      }
    }

    // Tree silhouettes appearing as surface rises
    if (surfaceP > 0.5) {
      ctx.fillStyle = 'rgba(20,50,15,0.8)';
      for (let i = 0; i < 8; i++) {
        const tx = (i * 70 + 20) % W;
        const th = 40 + Math.sin(i * 2.3) * 20;
        ctx.fillRect(tx - 8, surfaceY - th, 16, th);
        ctx.fillRect(tx - 20, surfaceY - th * 0.6, 40, th * 0.5);
      }
    }

    // Speed lines in upper area (falling sensation)
    if (landingTime < LANDING_DURATION * 0.7) {
      ctx.strokeStyle = 'rgba(200,220,255,0.2)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 12; i++) {
        const lx = (i * 45 + landingTime * 80) % W;
        const len = 20 + Math.random() * 40;
        ctx.beginPath();
        ctx.moveTo(lx, 0);
        ctx.lineTo(lx + 5, len);
        ctx.stroke();
      }
    }

    // Smoke particles
    ctx.imageSmoothingEnabled = false;
    for (const s of landingSmoke) {
      const a = s.life / s.max;
      ctx.fillStyle = `rgba(80,80,90,${a * 0.6})`;
      ctx.fillRect(Math.round(s.x - s.r), Math.round(s.y - s.r), s.r * 2, s.r * 2);
    }

    // The ship — drawn large (she was inside it)
    const shipScale = 2.2;
    ctx.save();
    ctx.translate(Math.round(W / 2), Math.round(landingShipY));
    ctx.rotate(landingShipAngle);
    ctx.scale(shipScale, shipScale);
    drawShip(0, 0, 0, 1, false);
    ctx.restore();

    // Dust particles after landing
    for (const d of landingDustParticles) {
      const a = d.life / d.max;
      ctx.fillStyle = `rgba(180,160,100,${a * 0.7})`;
      ctx.fillRect(Math.round(d.x), Math.round(d.y), 3, 3);
    }

    // "PLANET: VERDANT" title fading in during last ~1.5s
    const titleP = Math.max(0, (landingTime - LANDING_DURATION * 0.7) / (LANDING_DURATION * 0.3));
    if (titleP > 0) {
      ctx.globalAlpha = Math.min(1, titleP * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, H / 2 - 30, W, 50);
      ctx.fillStyle = '#88ffaa';
      ctx.font = 'bold 18px Orbitron, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('PLANET: VERDANT', W / 2, H / 2);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '11px Orbitron, monospace';
      ctx.fillText('PREPARE FOR COMBAT', W / 2, H / 2 + 20);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  function renderCrash() {
    ctx.save();
    const sx = (Math.random()-0.5)*crashShake, sy = (Math.random()-0.5)*crashShake;
    ctx.translate(sx, sy);
    drawNebula(crashTime); drawStars(crashTime);
    // Motion/speed lines during tumble — more dynamic, varied lengths
    if (crashTime > 1.2) {
      ctx.strokeStyle = 'rgba(200,210,240,0.12)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 18; i++) {
        const ly = Math.random()*H;
        const lx = Math.random()*W;
        const len = 40+Math.random()*100;
        ctx.beginPath();
        ctx.moveTo(Math.round(lx), Math.round(ly));
        ctx.lineTo(Math.round(lx-len), Math.round(ly));
        ctx.stroke();
      }
    }
    // Thicker layered smoke — dark gray pixel puffs with volumetric feel
    for (const s of crashSmoke) {
      const a = s.life/s.max;
      // Outer puff — darker, larger, softer
      ctx.fillStyle = `rgba(35,35,45,${a*0.4})`;
      ctx.fillRect(Math.round(s.x-s.r*1.8), Math.round(s.y-s.r*1.8), Math.round(s.r*3.6), Math.round(s.r*3.6));
      // Mid puff — medium gray, slightly offset
      ctx.fillStyle = `rgba(55,55,70,${a*0.55})`;
      ctx.fillRect(Math.round(s.x-s.r*1.1), Math.round(s.y-s.r*1.1), Math.round(s.r*2.2), Math.round(s.r*2.2));
      // Inner puff — lighter gray, core
      ctx.fillStyle = `rgba(80,80,95,${a*0.6})`;
      ctx.fillRect(Math.round(s.x-s.r*0.5), Math.round(s.y-s.r*0.5), Math.round(s.r), Math.round(s.r));
      // Bright center — near-white hot core
      ctx.fillStyle = `rgba(120,120,135,${a*0.35})`;
      ctx.fillRect(Math.round(s.x-1), Math.round(s.y-1), 2, 2);
    }
    drawShip(ship.x, ship.y, ship.angle||0, 1, false);
    // Missile with glow
    if (crashMissile) {
      ctx.fillStyle = 'rgba(255,170,50,0.3)';
      ctx.fillRect(crashMissile.x-6, crashMissile.y-4, 12, 8);
      ctx.fillStyle = '#ffaa33';
      ctx.fillRect(crashMissile.x-4, crashMissile.y-2, 8, 4);
      ctx.fillStyle = '#ff5522';
      ctx.fillRect(crashMissile.x+4, crashMissile.y-1, 4, 2);
    }
    // Sparks — warm oranges, bright whites, and rising embers — enhanced brightness
    for (const s of crashSparks) {
      const a = s.life/s.max;
      if (s.white) {
        ctx.fillStyle = `rgba(255,255,245,${Math.min(1, a*1.3)})`;
      } else if (s.ember) {
        ctx.fillStyle = `rgba(255,${130+Math.floor(a*90)},25,${a*0.9})`;
      } else {
        const warmth = s.hue === 'hot' ? 150 : 180;
        const bright = Math.min(255, warmth+Math.floor(Math.random()*60));
        ctx.fillStyle = `rgba(255,${bright},35,${Math.min(1, a*1.2)})`;
      }
      const sz = s.white ? 2 : (s.ember ? 1 : (1+Math.random()*3));
      ctx.fillRect(Math.round(s.x), Math.round(s.y), sz, sz);
    }
    ctx.restore();
    // White impact flash — slightly stronger
    if (crashFlash > 0.02) {
      ctx.fillStyle = `rgba(255,255,255,${crashFlash})`;
      ctx.fillRect(0, 0, W, H);
    }
    // Vignette overlay
    var vig = ctx.createRadialGradient(W/2,H/2,W*0.25,W/2,H/2,W*0.75);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }

  // ==================== PHASE TRANSITION ====================
  function updateStageTransition(dt) {
    stageTimer += dt;
    // Check if the space-runner duration has elapsed — trigger crash sequence
    if (stage === STAGE.SPACE_RUNNER && stageTimer >= SPACE_RUNNER_DURATION && !crashStarted) {
      startCrash();
    }
  }

  function startTransition(toStage, color) {
    transitioning = true;
    transitionTimer = 1.5;
    transitionPhase = toStage;
    transitionColor = color;
    transitionAlpha = 0;
    playSound('phaseChime');
  }


  // ==================== INIT / RESET ====================
  function init() {
    initStars(); initNebula(); initGalaxies(); initPlanets();
    initDistantShips(); initSpaceCity(); initDust(); initStarClusters();
    initSignaturePlanet();
    initJungle();
    initPlanetRunner();
    initStaticCanvases();
    setupInput();
    loadAllSprites();
  }

  function resetGameState() {
    score = 0; lives = MAX_LIVES; difficultyMult = 1;
    invincibleUntil = 0; stageTimer = 0; sectorTimer = 0; sectorIndex = 0;
    runnerObstacles = []; runnerSpawnTimer = 0; runnerSpawnDelay = 1.8;
    shootingStars = []; nextShootingStarTime = 3+Math.random()*5;
    debris = []; thrusterParticles = []; explosionParticles = [];
    ship.x = SHIP_X; ship.y = SHIP_REST_Y; ship.vy = 0;
    ship.onGround = true; ship.angle = 0; ship.enginePulse = 0;
    crashStarted = false; crashTime = 0; crashSmoke = []; crashSparks = [];
    crashShake = 0; crashFlash = 0; crashMissile = null;
    // Planet runner reset
    planetObstacles = []; planetEnemies = []; laserBeams = [];
    planetSpawnTimer = 0; planetScrollSpeed = PLANET_SCROLL_BASE;
    jungleScroll = 0; jungleTrees = initJungleTrees(); jungleCreatures = [];
    nextCreatureTimer = 5 + Math.random() * 8;
    char.y = CHAR_GROUND_Y; char.vy = 0; char.onGround = true;
    char.jumpsUsed = 0; char.state = 'idle'; char.stateTimer = 0;
    char.animFrame = 0; char.animTimer = 0;
    char.slideTimer = 0; char.isSliding = false;
    char.tapCount = 0; char.tapTimer = 0;
    char.shootReadyTimer = 0; char.shootCooldown = 0;
    charInvincible = 0;
  }

  function startNewGame() {
    resetGameState();
    stage = STAGE.SPACE_RUNNER;
    gameState = STATE.PLAYING;
    startLoop();
  }

  // ==================== GAME LOOP ====================
  function startLoop() {
    if (animFrameId !== null) { cancelAnimationFrame(animFrameId); animFrameId = null; }
    lastTime = performance.now();
    animFrameId = requestAnimationFrame(gameLoop);
  }

  function gameLoop(timestamp) {
    dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    update(dt);
    render();
    animFrameId = requestAnimationFrame(gameLoop);
  }

  function update(dt) {
    if (gameState !== STATE.PLAYING) return;
    if (isPaused) return;
    if (crashStarted) {
      updateCrash(dt);
      return;
    }
    if (transitioning) {
      updateStageTransition(dt);
      return;
    }
    if (stage === STAGE.LANDING) {
      updateLanding(dt);
      return;
    }
    if (stage === STAGE.SPACE_RUNNER) {
      updateDrift(dt);
    } else if (stage === STAGE.PLANET_RUNNER) {
      updateCharacter(dt);
      updatePlanetObstacles(dt);
      updateLaserBeams(dt);
      checkPlanetCollisions();
      if (charInvincible > 0) charInvincible -= dt;
    }
    updateStageTransition(dt);
    updateStars(dt);
    updateParticles(dt);
    updateExplosionParticles(dt);
    distantShipTimer += dt;
    if (distantShipTimer > 8+Math.random()*5) { distantShipTimer = 0; spawnDistantShip(); }
    if (!spaceCity && Math.random() < 0.001) spawnSpaceCity();
  }

  function render() {
    time = performance.now()*0.001;
    ctx.clearRect(0, 0, W, H);
    if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0);
    ctx.imageSmoothingEnabled = false;
    if (gameState === STATE.MENU) {
      drawMenu(time);
    } else if (gameState === STATE.PLAYING) {
      if (crashStarted) {
        renderCrash();
      } else if (transitioning && transitionPhase === 'CRASH_CINEMATIC') {
        // Transition active — freeze frame
      } else if (stage === STAGE.LANDING) {
        renderLanding();
      } else if (stage === STAGE.PLANET_RUNNER) {
        drawJungle(dt, time);
        drawPlanetObstacles(time);
        drawLaserBeams();
        drawCharacter();
        drawParticles();
        drawExplosionParticles();
        drawPlanetHUD();
      } else {
        drawNebula(time); drawGalaxies(time); drawStarClusters(time);
        drawSignaturePlanet(time); drawPlanets(time); drawStars(time);
        updateAndDrawShootingStars(dt, time);
        drawDistantShips(dt); drawSpaceCity(dt); drawDust(dt);
        if (stage === STAGE.SPACE_RUNNER) {
          drawRunnerObstacles();
        }
        drawParticles(); drawGroundLine();
        drawShip(ship.x, ship.y);
        drawExplosionParticles();
        drawHUD();
        drawScanLineWipe();
        // Vignette overlay — cinematic framing
        if (vignetteCanvas) ctx.drawImage(vignetteCanvas, 0, 0);
      }
    } else if (gameState === STATE.GAME_OVER) {
      drawNebula(time); drawStars(time);
      drawExplosionParticles();
      drawGameOverScreen();
    }
  }

  // ==================== RESIZE ====================
  function resizeCanvas() {
    var aspect = W/H, windowAspect = window.innerWidth/window.innerHeight;
    var scale;
    if (windowAspect > aspect) scale = window.innerHeight/H;
    else scale = window.innerWidth/W;
    canvas.width = W; canvas.height = H;
    canvas.style.width = Math.floor(W*scale)+'px';
    canvas.style.height = Math.floor(H*scale)+'px';
    ctx.imageSmoothingEnabled = false;
  }

  // ==================== START ====================
  window.addEventListener('DOMContentLoaded', function() {
    init(); resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    startLoop();
  });

  document.addEventListener('keydown', function(e) {
    if (e.code === 'Space' && (gameState === STATE.MENU || gameState === STATE.GAME_OVER)) {
      e.preventDefault(); initAudio(); startNewGame();
    }
  });

})();
</script>
</body>
