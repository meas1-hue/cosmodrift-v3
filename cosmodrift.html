<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CosmoDrift v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
html { width:100%; height:100%; overflow:hidden; background:#060a1a; }
body { width:100%; height:100%; overflow:hidden; background:#060a1a; position:fixed; top:0; left:0; touch-action:none; overscroll-behavior:none; display:flex; align-items:center; justify-content:center; }
canvas { display:block; touch-action:none; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; image-rendering:pixelated; image-rendering:crisp-edges; }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<script>
(function() {
  'use strict';
  // ==================== CONSTANTS ====================
  const W = 480, H = 640;
  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d');

  // Game states
  const STATE = { MENU: 'MENU', PLAYING: 'PLAYING', GAME_OVER: 'GAME_OVER' };

  // Stage machine — replaces old PHASE system
  const STAGE = { SPACE_RUNNER: 'SPACE_RUNNER', CRASH_CINEMATIC: 'CRASH_CINEMATIC', LANDING: 'LANDING', PLANET_RUNNER: 'PLANET_RUNNER' };

  // Ship — runner style, rests near bottom
  const SHIP_X = 90;
  const SHIP_REST_Y = H - 60;  // 580
  const SHIP_CEILING = 30;
  const DRIFT_GRAVITY = 1400;
  const DRIFT_THRUST = -520;
  const DRIFT_MAX_VY = 800;

  // Ship pixel grid — 22×14, SHIP_PX=2 → 44×28px
  // Retro saucer: gray metallic hull, cyan dome, running lights, thruster
  var SHIP_PX = 2;
  var SHIP_PIXELS = [
    "........WWWWWWWW........",
    ".......DDCCCCCCDD.......",
    "......DCCCCCCCCCCD......",
    ".....DCCCCCCCCCCCCC.....",
    ".....HGGCCCCCCHGGGG.....",
    "....HGGGGYCCGGGGGGYY....",
    "...HGGGGGGGGGGGGGGGGH...",
    "..HGGGGGGGGGGGGGGGGGGH..",
    "..HGGGGGGGGGGGGGGGGGGH..",
    "..HGGGGSSSSSSSSSSGGGGH..",
    ".HGGGGSSSSSSSSSSSSGGGGH.",
    ".HGGGGSSSSSSSSSSSSGGGGH.",
    "TTTTTTTTTTTTTTTTTTTTTTTT",
    ".TTTTTTTTTTTTTTTTTTTTTT.",
  ];
  var SHIP_COLORS = {
    'H': '#c8d0d8', 'G': '#8a9aa8', 'S': '#5a6a78',
    'C': '#80d4ee', 'D': '#1a6a9a', 'W': '#ffffff',
    'Y': '#ffcc44', 'B': '#60c8ff', 'T': '#3090cc',
    '.': null
  };
  var SHIP_GRID_W = SHIP_PIXELS[0].length; // 22
  var SHIP_GRID_H = SHIP_PIXELS.length;    // 14

  // ==================== SPRITE LOADING SYSTEM ====================
  // Sprite frames. NOTE: the source filenames do NOT describe their pose — the
  // set was delivered mislabelled. Each key below is loaded by the pose it
  // ACTUALLY depicts (verified by eye), which is what the animation table uses.
  // Only the frames whose backgrounds key out cleanly are included; the rest of
  // the delivered files sit on an un-keyable studio gradient and are unused.
  //   hurt.jpg   -> standing idle           run2.jpg  -> running stride
  //   roll2.jpg  -> running stride          roll1.jpg -> aerial leap (faces left)
  //   run_alt.jpg-> dash burst (black bg)   death.jpg -> low crouch
  //   slide.jpg  -> braced gunfire          aim.jpg   -> lunging gunfire w/ flash
  var SPRITE_FILES = {
    hurt:    { file: 'hurt.jpg' },                 // standing idle (faces right)
    run2:    { file: 'run2.jpg' },                 // run stride A (faces right)
    roll2:   { file: 'roll2.jpg' },                // run stride B (faces right)
    roll1:   { file: 'roll1.jpg', flip: true },    // aerial leap — flip to travel direction
    run_alt: { file: 'run_alt.jpg', blackBg: true},// dash burst, black background
    death:   { file: 'death.jpg' },                // low crouch (faces right)
    slide:   { file: 'slide.jpg' },                // braced gunfire (faces right)
    aim:     { file: 'aim.jpg' }                   // lunging gunfire w/ muzzle flash
  };

  // Loaded sprite canvases: spriteCanvases[name] = canvas
  var sprites = {};
  var spritesLoaded = false;
  var spritesError = false;

  // Background removal. The sprite frames sit on a light grey "transparency"
  // checkerboard (two near-grey shades, lightened further by JPEG compression)
  // or, for the black-bg frame, a near-black field. We flood-fill inward from
  // the four edges, treating any low-saturation / bright pixel as background.
  // Because the predicate is generous, the fill sweeps the entire connected
  // backdrop in one pass instead of getting trapped on JPEG noise at the
  // checker-square boundaries (the bug that left the old key removing almost
  // nothing). Flooding from the edges also means interior grey pixels — the
  // gun's metal, muzzle-flash cores — are enclosed by the character and so are
  // never reached, which preserves them.
  function floodFillRemoveBg(img, isBlackBg) {
    var tc = document.createElement('canvas');
    tc.width = img.naturalWidth || img.width;
    tc.height = img.naturalHeight || img.height;
    var tx = tc.getContext('2d');
    tx.drawImage(img, 0, 0);
    var id, d;
    try { id = tx.getImageData(0, 0, tc.width, tc.height); d = id.data; }
    catch (e) { return tc; }
    var w = tc.width, h = tc.height, n = w * h;
    var visited = new Uint8Array(n);

    function isBg(idx) {
      var r = d[idx*4], g = d[idx*4+1], b = d[idx*4+2];
      if (isBlackBg) return r < 45 && g < 45 && b < 45;
      // Checker bg: low colour saturation and not dark. Catches both grey
      // shades and the JPEG transitions between them.
      var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      return (mx - mn) < 40 && (r + g + b) > 430;
    }

    var queue = [];
    function seed(x, y) {
      var idx = y * w + x;
      if (!visited[idx] && isBg(idx)) { visited[idx] = 1; queue.push(idx); }
    }
    for (var x = 0; x < w; x++) { seed(x, 0); seed(x, h-1); }
    for (var y = 0; y < h; y++) { seed(0, y); seed(w-1, y); }

    var nbrs = [-1, 1, -w, w];
    var qi = 0;
    while (qi < queue.length) {
      var idx = queue[qi++];
      for (var k = 0; k < 4; k++) {
        var ni = idx + nbrs[k];
        if (ni < 0 || ni >= n || visited[ni]) continue;
        // Don't let horizontal steps wrap across rows.
        if ((nbrs[k] === -1 && idx % w === 0) || (nbrs[k] === 1 && idx % w === w-1)) continue;
        if (isBg(ni)) { visited[ni] = 1; queue.push(ni); }
      }
    }

    // Safety guard: if we somehow erased almost the whole frame, revert to the
    // raw image so the character is never invisible.
    if (queue.length > 0.985 * n) {
      var raw = document.createElement('canvas');
      raw.width = w; raw.height = h;
      raw.getContext('2d').drawImage(img, 0, 0);
      return raw;
    }

    for (var qj = 0; qj < queue.length; qj++) d[queue[qj]*4+3] = 0;
    tx.putImageData(id, 0, 0);
    return tc;
  }

  function flipCanvasHorizontal(srcCanvas) {
    var tc = document.createElement('canvas');
    tc.width = srcCanvas.width; tc.height = srcCanvas.height;
    var tx = tc.getContext('2d');
    tx.translate(tc.width, 0);
    tx.scale(-1, 1);
    tx.drawImage(srcCanvas, 0, 0);
    return tc;
  }

  // Crop a (flood-filled) canvas down to the bounding box of its opaque pixels.
  // The source frames place a small figure on a large studio backdrop; once the
  // backdrop is transparent the figure can sit anywhere in the frame with wide,
  // pose-dependent margins. Drawing the whole frame therefore makes the
  // character float above the ground and appear at an inconsistent scale.
  // Cropping to the opaque content gives every pose a tight box whose bottom
  // edge is the character's feet, so the renderer can anchor and size her
  // predictably.
  function cropToContent(canvas) {
    var w = canvas.width, h = canvas.height;
    if (!w || !h) return canvas;
    var cx = canvas.getContext('2d');
    var data;
    try { data = cx.getImageData(0, 0, w, h).data; }
    catch (e) { return canvas; }
    var minX = w, minY = h, maxX = -1, maxY = -1;
    var ALPHA = 24; // ignore near-transparent anti-aliased fringe
    for (var y = 0; y < h; y++) {
      var row = y * w;
      for (var x = 0; x < w; x++) {
        if (data[(row + x) * 4 + 3] > ALPHA) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    // Fully transparent or already tight — nothing to crop.
    if (maxX < minX || maxY < minY) return canvas;
    var cw = maxX - minX + 1, ch = maxY - minY + 1;
    if (cw >= w && ch >= h) return canvas;
    var out = document.createElement('canvas');
    out.width = cw; out.height = ch;
    out.getContext('2d').drawImage(canvas, minX, minY, cw, ch, 0, 0, cw, ch);
    return out;
  }

  // Load all sprites and store as canvases
  function loadAllSprites() {
    var keys = Object.keys(SPRITE_FILES);
    var remaining = keys.length;

    keys.forEach(function(name) {
      var cfg = SPRITE_FILES[name];
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        try {
          var canvas = floodFillRemoveBg(img, cfg.blackBg);
          canvas = cropToContent(canvas);
          if (cfg.flip) canvas = flipCanvasHorizontal(canvas);
          sprites[name] = canvas;
        } catch(e) {
          console.warn('Sprite processing failed for', name, e);
          // Fallback: use raw image
          var tc = document.createElement('canvas');
          tc.width = img.naturalWidth; tc.height = img.naturalHeight;
          tc.getContext('2d').drawImage(img, 0, 0);
          sprites[name] = cfg.flip ? flipCanvasHorizontal(tc) : tc;
        }
        remaining--;
        if (remaining === 0) { spritesLoaded = true; console.log('All sprites loaded:', Object.keys(sprites).length); }
      };
      img.onerror = function() {
        console.warn('Failed to load sprite:', cfg.file);
        // Fallback: blank canvas
        var tc = document.createElement('canvas');
        tc.width = 1; tc.height = 1;
        sprites[name] = tc;
        remaining--;
        if (remaining === 0) { spritesLoaded = true; spritesError = true; }
      };
      img.src = 'sprites/' + cfg.file;
    });
  }

  // Scroll speed
  const DRIFT_BASE_SPEED = 105;
  const DRIFT_MAX_SPEED = 180;
  const SPACE_RUNNER_DURATION = 20; // seconds before crash trigger

  // Lives
  const MAX_LIVES = 3;
  const INVINCIBLE_DURATION = 2;

  // Stars — 3 layers with richer distribution
  const STAR_LAYERS = 3;
  const STARS_PER_LAYER = [100, 65, 35];
  const STAR_SPEEDS = [30, 60, 120];
  const STAR_SIZES = [[0.5,1.5],[1,2],[1.5,2.5]];
  const STAR_BRIGHTNESS = [[0.25,0.6],[0.4,0.85],[0.6,1.0]];

  // Nebula
  const NEBULA_POINTS = 10;

  // Difficulty cap
  const MAX_DIFFICULTY = 2.5;

  // Background extras
  const MAX_GALAXIES = 3;
  const MAX_PLANETS = 4;
  const MAX_DISTANT_SHIPS = 4;
  const MAX_DUST = 50;

  // Runner obstacles
  const RUNNER_SPAWN_INTERVAL_BASE = 2.2;
  const RUNNER_SPAWN_MIN_GAP = 1.8;

  // Sector names for HUD
  const SECTOR_NAMES = [
    'SECTOR 7-G', 'VOID EXPANSE', 'NEBULA FIELD', 'ASTEROID BELT',
    'DEEP SPACE', 'PULSAR ZONE', 'COSMIC DRIFT', 'STAR HAVEN',
    'QUANTUM RUN', 'DARK MATTER', 'SOLAR FLARE', 'ORBITAL EDGE'
  ];

  // Planet runner constants
  const CHAR_GROUND_Y = H - 90;
  const CHAR_X = 120;
  const CHAR_DISPLAY_H = 180;
  const CHAR_GRAVITY = 2200;
  const CHAR_JUMP_V1 = -720;
  const CHAR_JUMP_V2 = -580;
  const CHAR_SLIDE_DURATION = 0.55;

  // Planet runner state
  let planetObstacles = [];
  let planetEnemies = [];
  let planetSpawnTimer = 0;
  const PLANET_SPAWN_INTERVAL_BASE = 2.0;
  const PLANET_SCROLL_BASE = 180;
  let planetScrollSpeed = PLANET_SCROLL_BASE;
  let planetStartTime = 0;
  let laserBeams = [];
  let jungleScroll = 0;
  let jungleTrees = [];
  let jungleCreatures = [];
  let nextCreatureTimer = 5;

  // Planet runner character
  let char = {
    y: CHAR_GROUND_Y, vy: 0, onGround: true, jumpsUsed: 0,
    state: 'idle', stateTimer: 0, animFrame: 0, animTimer: 0,
    slideTimer: 0, isSliding: false,
    tapCount: 0, tapTimer: 0, shootReadyTimer: 0, shootCooldown: 0,
    hitW: 40, hitH: 120
  };
  let charInvincible = 0;

  // Animation table. Frame names refer to SPRITE_FILES keys (loaded by the pose
  // they actually show). The character always travels to the right, so every
  // pose faces right.
  const CHAR_ANIMS = {
    idle:     { frames: ['hurt'],            fps: 1,  loop: true  },   // standing
    run:      { frames: ['run2','roll2'],    fps: 9,  loop: true  },   // 2-frame sprint
    run_alt:  { frames: ['run_alt'],         fps: 10, loop: true  },
    jump:     { frames: ['roll1'],           fps: 1,  loop: false },   // aerial leap
    roll:     { frames: ['run_alt'],         fps: 1,  loop: false },   // double-jump dash
    land:     { frames: ['death'],           fps: 1,  loop: false, duration: 0.18 },
    slide:    { frames: ['death'],           fps: 1,  loop: true  },   // low crouch (drawn short)
    air_dive: { frames: ['roll1','death'],   fps: 8,  loop: false },
    aim:      { frames: ['slide'],           fps: 1,  loop: false },
    fire:     { frames: ['slide','aim'],     fps: 8,  loop: false, duration: 0.3 }, // raise → fire
    hurt:     { frames: ['death'],           fps: 1,  loop: false, duration: 0.4  }, // stumble
    death:    { frames: ['death'],           fps: 1,  loop: false }    // collapse
  };

  // On-screen display height (px) per pose. The character is rendered with her
  // feet on the ground line and centred on CHAR_X; normalising height per pose
  // keeps her a consistent size regardless of how each source frame was cropped,
  // and keeps crouched poses (slide/land/death) reading as low to the ground.
  const CHAR_STATE_HEIGHT = {
    idle: 120, run: 120, run_alt: 118, jump: 116, aim: 122, fire: 122,
    hurt: 110, land: 100, death: 100, roll: 112, air_dive: 108, slide: 76
  };

  // ==================== GAME STATE ====================
  let gameState = STATE.MENU;
  let stage = STAGE.SPACE_RUNNER;
  let stageTimer = 0;
  let time = 0;
  let dt = 0;
  let score = 0;
  let lives = MAX_LIVES;
  let difficultyMult = 1;
  let highScore = parseInt(localStorage.getItem('cosmodrift_highscore') || '0');
  let invincibleUntil = 0;
  let lastTime = 0;
  let menuShipX = 0;
  let menuShipDir = 1;
  let transitionAlpha = 0;
  let transitioning = false;
  let transitionTimer = 0;
  let transitionPhase = '';
  let transitionColor = '';
  let sectorIndex = 0;
  let sectorTimer = 0;
  let altDisplay = 0;

  // Crash cinematic state
  let crashTime = 0;
  const CRASH_DURATION = 5;
  let crashSmoke = [];
  let crashSparks = [];
  let crashShake = 0;
  let crashFlash = 0;
  let crashMissile = null;
  let crashStarted = false;

  // Landing cinematic state (bridges crash -> planet runner)
  let landingTime = 0;
  const LANDING_DURATION = 5.0;
  let landingPlanetScale = 0;   // planet surface grows from 0->1
  let landingShipY = -100;      // ship descends from top
  let landingShipAngle = 0;
  let landingSmoke = [];
  let landingDustParticles = [];
  let landingCameraShake = 0;

  // Planet runner state

  // Animation frame ID
  let animFrameId = null;

  // Tab pause
  let isPaused = false;
  let pauseTimestamp = 0;

  // Ship state
  let ship = {
    x: SHIP_X, y: SHIP_REST_Y, vy: 0,
    onGround: true, angle: 0, enginePulse: 0
  };

  // Input
  let keys = {};
  let touchState = { thrust: false, left: false, right: false, fire: false };
  let touchStartX = 0, touchStartY = 0;
  let touchDeltaX = 0;
  let touchMoveDir = 0;
  let touchShoot = false;
  let touchJump = false;

  // Collections
  let stars = [];
  let nebulaPoints = [];
  let runnerObstacles = [];
  let runnerSpawnTimer = 0;
  let runnerSpawnDelay = 1.8;
  let debris = [];
  let thrusterParticles = [];
  let explosionParticles = [];

  // Background extras
  let galaxies = [];
  let planets = [];
  let distantShips = [];
  let spaceCity = null;
  let dustMotes = [];
  let distantShipTimer = 0;
  let signaturePlanet = null;
  var vignetteCanvas = null;
  var bgCanvas = null;
  var sunBodyCache = {};

  // Shooting stars
  let shootingStars = [];
  let nextShootingStarTime = 3 + Math.random() * 5;

  // Star clusters
  let starClusters = [];

  // Audio
  let audioCtx = null;
  let ambientGain = null;
  let ambientOsc = null;
  let lastThrustSoundTime = 0;
  const THRUST_SOUND_COOLDOWN = 0.08;

  // ==================== AUDIO SYSTEM ====================
  function initAudio() {
    if (audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); startAmbientDrone(); } catch(e) {}
  }
  function startAmbientDrone() {
    if (!audioCtx) return;
    try {
      ambientGain = audioCtx.createGain();
      ambientGain.gain.value = 0.03;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass'; filter.frequency.value = 200;
      ambientOsc = audioCtx.createOscillator();
      ambientOsc.type = 'sine'; ambientOsc.frequency.value = 60;
      ambientOsc.connect(filter); filter.connect(ambientGain);
      ambientGain.connect(audioCtx.destination); ambientOsc.start();
    } catch(e) {}
  }
  function playSound(type) {
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      switch (type) {
        case 'thrust': {
          const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.08); break;
        }
        case 'explosion': {
          const bufferSize = audioCtx.sampleRate * 0.4;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = (Math.random()*2-1) * Math.pow(1-i/bufferSize, 2);
          const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass'; filter.frequency.setValueAtTime(800, now);
          filter.frequency.exponentialRampToValueAtTime(100, now + 0.4);
          noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
          noise.start(now);
          const osc = audioCtx.createOscillator(), oscGain = audioCtx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
          oscGain.gain.setValueAtTime(0.12, now);
          oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(oscGain); oscGain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.3); break;
        }
        case 'phaseChime': {
          const osc1 = audioCtx.createOscillator(), osc2 = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc1.type = 'sine'; osc1.frequency.setValueAtTime(800, now);
          osc1.frequency.exponentialRampToValueAtTime(1200, now + 0.3);
          osc2.type = 'sine'; osc2.frequency.setValueAtTime(1000, now + 0.15);
          osc2.frequency.exponentialRampToValueAtTime(1400, now + 0.45);
          gain.gain.setValueAtTime(0.06, now); gain.gain.setValueAtTime(0.06, now + 0.4);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
          osc1.start(now); osc1.stop(now + 0.6); osc2.start(now + 0.15); osc2.stop(now + 0.6); break;
        }
        case 'hit': {
          const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.type = 'square'; osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.15); break;
        }
      }
    } catch(e) {}
  }

  // ==================== INPUT SYSTEM ====================
  function setupInput() {
    document.addEventListener('keydown', function(e) {
      keys[e.code] = true;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'ArrowLeft' || e.code === 'ArrowRight') e.preventDefault();
      // Planet runner controls
      if (gameState === STATE.PLAYING && stage === STAGE.PLANET_RUNNER && !crashStarted) {
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { charJump(); e.preventDefault(); }
        if (e.code === 'ArrowDown' || e.code === 'KeyS') { charSlideOrDive(); e.preventDefault(); }
        if (e.code === 'KeyJ' || e.code === 'KeyZ' || e.code === 'KeyF') { charShoot(); e.preventDefault(); }
      }
    });
    document.addEventListener('keyup', function(e) { keys[e.code] = false; });

    canvas.addEventListener('touchstart', function(e) {
      e.preventDefault(); e.stopPropagation();
      const touch = e.touches[0];
      touchStartX = touch.clientX; touchStartY = touch.clientY;
      if (gameState === STATE.MENU || gameState === STATE.GAME_OVER) { initAudio(); startNewGame(); return; }
      if (transitioning || crashStarted) return;
      if (stage === STAGE.SPACE_RUNNER) {
        ship.vy = DRIFT_THRUST; ship.onGround = false; ship.enginePulse = 1;
        if (performance.now() - lastThrustSoundTime > THRUST_SOUND_COOLDOWN * 1000) { playSound('thrust'); lastThrustSoundTime = performance.now(); }
        spawnThrusterParticle(ship.x, ship.y);
      }
      // Planet runner: the action is decided on release (touchend) so a tap,
      // a swipe-up, a swipe-down and a swipe-right map to distinct moves.
    }, { passive: false });

    canvas.addEventListener('touchmove', function(e) {
      e.preventDefault(); e.stopPropagation();
      if (transitioning || crashStarted) return;
      var dx = e.touches[0].clientX - touchStartX;
      touchDeltaX = dx;
      if (Math.abs(dx) >= 30) touchMoveDir = dx > 0 ? 1 : -1;
    }, { passive: false });

    canvas.addEventListener('touchend', function(e) {
      e.preventDefault(); e.stopPropagation();
      if (transitioning || crashStarted) return;
      var dx = e.changedTouches[0].clientX - touchStartX;
      var dy = e.changedTouches[0].clientY - touchStartY;
      var isTap = Math.abs(dx) < 30 && Math.abs(dy) < 30;
      if (stage === STAGE.SPACE_RUNNER && isTap) {
        ship.vy = DRIFT_THRUST; ship.onGround = false; ship.enginePulse = 1;
        if (performance.now() - lastThrustSoundTime > THRUST_SOUND_COOLDOWN * 1000) { playSound('thrust'); lastThrustSoundTime = performance.now(); }
        spawnThrusterParticle(ship.x, ship.y);
      } else if (stage === STAGE.PLANET_RUNNER) {
        doPlanetGesture(dx, dy);
      }
      touchShoot = false;
      touchJump = false;
      touchDeltaX = 0; touchMoveDir = 0;
    }, { passive: false });

    canvas.addEventListener('mousedown', function(e) {
      e.preventDefault(); initAudio();
      mouseStartX = e.clientX; mouseStartY = e.clientY; mouseDown = true;
      handleTouchAction('start');
    });
    canvas.addEventListener('mouseup', function(e) {
      e.preventDefault();
      if (mouseDown && gameState === STATE.PLAYING && stage === STAGE.PLANET_RUNNER
          && !transitioning && !crashStarted) {
        doPlanetGesture(e.clientX - mouseStartX, e.clientY - mouseStartY);
      }
      mouseDown = false;
      handleTouchAction('end');
    });
  }

  // Planet-runner gesture mapping shared by touch and mouse: tap or swipe-up =
  // jump, swipe-down = slide/dive, swipe-right = shoot. The dominant axis (and a
  // small dead-zone) decides which.
  let mouseStartX = 0, mouseStartY = 0, mouseDown = false;
  function doPlanetGesture(dx, dy) {
    var THRESH = 32;
    if (Math.abs(dy) > Math.abs(dx) && dy < -THRESH) { charJump(); }
    else if (Math.abs(dy) > Math.abs(dx) && dy > THRESH) { charSlideOrDive(); }
    else if (Math.abs(dx) > Math.abs(dy) && dx > THRESH) { charShoot(); }
    else if (Math.abs(dx) < THRESH && Math.abs(dy) < THRESH) { charJump(); }
  }

  function handleTouchAction(action) {
    if (gameState === STATE.MENU) { initAudio(); startNewGame(); return; }
    if (gameState === STATE.GAME_OVER) { initAudio(); startNewGame(); return; }
    if (gameState === STATE.PLAYING) {
      if (transitioning || crashStarted) return;
      if (stage === STAGE.SPACE_RUNNER) {
        if (action === 'start') {
          ship.vy = DRIFT_THRUST; ship.onGround = false; ship.enginePulse = 1;
          if (performance.now() - lastThrustSoundTime > THRUST_SOUND_COOLDOWN * 1000) { playSound('thrust'); lastThrustSoundTime = performance.now(); }
          spawnThrusterParticle(ship.x, ship.y);
        }
      }
    }
  }

  // ==================== STARFIELD ====================

  function updateStars(dt) {
    for (let i = 0; i < stars.length; i++) {

      s.x -= speedMult * 40 * dt;

  function drawStars(time) {

      var col = starColors[s.layer];
      var r = col[0], g = col[1], b = col[2];
      if (s.hueShift !== 0) {
        r = Math.min(255, Math.max(0, r + Math.floor(s.hueShift * 80)));

      }
      ctx.fillStyle = 'rgba('+r+','+g+','+b+','+twinkle+')';

    }
  }

  function drawNebula(time) {

      grad.addColorStop(0, 'rgba('+n.color.r+','+n.color.g+','+n.color.b+','+(alpha*3.5)+')');
      grad.addColorStop(0.2, 'rgba('+n.color.r+','+n.color.g+','+n.color.b+','+(alpha*2.5)+')');
      grad.addColorStop(0.45, 'rgba('+n.color.r+','+n.color.g+','+n.color.b+','+(alpha*1.5)+')');
      grad.addColorStop(0.7, 'rgba('+n.color.r+','+n.color.g+','+n.color.b+','+(alpha*0.5)+')');

  // ==================== GALAXIES ====================
  function initGalaxies() {

  function drawGalaxies(time) {

  // ==================== PLANETS ====================
  // Generate a pixel-art planet sphere
  function createPixelPlanet(radius, colors) {
    var pixels = [];
    var blockSize = 4;
    var r = radius * blockSize;
    for (var py = -r; py <= r; py += blockSize) {
      for (var px = -r; px <= r; px += blockSize) {
        var dist = Math.sqrt(px * px + py * py);
        if (dist <= r) {
          var ci = Math.min(colors.length - 1, Math.floor((dist / r) * colors.length));
          pixels.push({ px: px, py: py, color: colors[ci] });
        }
      }
    }
    return { pixels: pixels, blockSize: blockSize, radius: radius };
  }
  // City silhouette generator for planet surface decoration
  function generateCitySilhouette(seed, width, maxH) {
    var buildings = [];
    var x = 0;
    var s = seed;
    var rng = function(n) {
      s = (s * 9301 + n * 49297 + 233) % 233280;
      return s / 233280;
    };
    var i = 0;
    while (x < width) {
      var bw = 4 + Math.floor(rng(i++) * 8);
      var bh = 6 + Math.floor(rng(i++) * maxH);
      buildings.push({ x: x, w: bw, h: bh });
      x += bw + 1 + Math.floor(rng(i++) * 3);
    }
    return buildings;
  }
  // Draw a planet with city lights on its surface
  function drawPlanetWithCity(p, time) {
    var bs = p.data.blockSize;
    var radius = p.data.radius;
    var px = p.x, py = p.y;
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    // Draw pixel sphere
    for (var i = 0; i < p.data.pixels.length; i++) {
      var pix = p.data.pixels[i];
      ctx.fillStyle = pix.color;
      ctx.fillRect(Math.round(px + pix.px * bs), Math.round(py + pix.py * bs), bs, bs);
    }
    // Atmospheric rim glow
    var rimColor = p.rimColor || '80,140,255';
    var rimGrad = ctx.createRadialGradient(px, py, radius * bs * 0.7, px, py, radius * bs * 1.3);
    rimGrad.addColorStop(0, 'rgba(0,0,0,0)');
    rimGrad.addColorStop(0.7, 'rgba(' + rimColor + ',0.15)');
    rimGrad.addColorStop(1, 'rgba(' + rimColor + ',0.35)');
    ctx.fillStyle = rimGrad;
    ctx.beginPath();
    ctx.arc(px, py, radius * bs * 1.4, 0, Math.PI * 2);
    ctx.fill();
    // City silhouette along bottom arc of planet
    if (p.city && p.cityBuildings) {
      var cityW = 0;
      for (var bi = 0; bi < p.cityBuildings.length; bi++) {
        var b = p.cityBuildings[bi];
        if (b.x + b.w > cityW) cityW = b.x + b.w;
      }
      var cityStartX = px - cityW / 2;
      var cityBaseY = py + radius * bs * 0.6;
      ctx.fillStyle = 'rgba(10,10,30,0.7)';
      for (var ci2 = 0; ci2 < p.cityBuildings.length; ci2++) {
        var cb = p.cityBuildings[ci2];
        ctx.fillRect(Math.round(cityStartX + cb.x), Math.round(cityBaseY - cb.h), cb.w, cb.h);
      }
      // City lights — windows flickering
      var flickerBase = 0.4 + 0.3 * Math.sin(time * 1.5 + p.citySeed);
      for (var di = 0; di < p.cityBuildings.length; di++) {
        var db = p.cityBuildings[di];
        for (var wy = 3; wy < db.h - 2; wy += 4) {
          for (var wx = 1; wx < db.w - 1; wx += 3) {
            var flick = flickerBase + 0.3 * Math.sin(time * 3 + db.x * 0.7 + wy * 0.5);
            if (flick > 0.5) {
              var lightCol = Math.random() > 0.8 ? '#ffcc44' : '#aaddff';
              ctx.fillStyle = lightCol;
              ctx.globalAlpha = flick * 0.9;
              ctx.fillRect(Math.round(cityStartX + db.x + wx), Math.round(cityBaseY - db.h + wy), 2, 2);
            }
          }
        }
      }
      ctx.globalAlpha = 1;
      // Antenna lights on tallest buildings
      var tallBuildings = [];
      for (var ti = 0; ti < p.cityBuildings.length; ti++) {
        if (p.cityBuildings[ti].h > 16) tallBuildings.push(p.cityBuildings[ti]);
      }
      for (var ai = 0; ai < Math.min(3, tallBuildings.length); ai++) {
        var tb = tallBuildings[ai];
        var blink = Math.sin(time * 2.5 + tb.x) > 0;
        ctx.fillStyle = blink ? '#ff3333' : '#330000';
        ctx.globalAlpha = 0.9;
        ctx.fillRect(Math.round(cityStartX + tb.x + tb.w / 2 - 1), Math.round(cityBaseY - tb.h - 4), 2, 4);
      }
      ctx.globalAlpha = 1;
    }
    // Rings (if planet has them)
    if (p.ring) {
      var ringR = radius * bs * 1.7;
      var ringTilt = 0.3;
      var ringColor = p.ringColor || '200,170,100';
      for (var ri = 0; ri < 3; ri++) {
        var rr = ringR + ri * bs * 1.5;
        ctx.strokeStyle = 'rgba(' + ringColor + ',0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(px, py, rr, rr * ringTilt, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  function initPlanets() {
    planets = [
      { data: createPixelPlanet(14,['#ff9966','#cc5533','#882211','#441100']), x:360, y:90, speed:0.08, ring:false, rimColor:'255,140,80', city:true, citySeed:1, cityBuildings:generateCitySilhouette(1,120,22) },
      { data: createPixelPlanet(10,['#cce8ff','#88bbdd','#446699','#223355']), x:100, y:160, speed:0.06, ring:false, rimColor:'100,180,255', city:true, citySeed:2, cityBuildings:generateCitySilhouette(2,80,16) },
      { data: createPixelPlanet(16,['#ddcc88','#aa9944','#776622','#443311']), x:240, y:55, speed:0.05, ring:true, ringColor:'210,185,110', rimColor:'220,190,80', city:true, citySeed:3, cityBuildings:generateCitySilhouette(3,140,28) },
      { data: createPixelPlanet(8,['#88ffaa','#44bb66','#226633','#113322']), x:420, y:220, speed:0.07, ring:false, rimColor:'80,220,120', city:true, citySeed:4, cityBuildings:generateCitySilhouette(4,60,14) },
    ];
  }
  function drawPlanets(time) {
    for (var i = 0; i < planets.length; i++) {
      var p = planets[i];
      p.x -= p.speed * 0.016;
      if (p.x < -p.data.radius * p.data.blockSize * 2) p.x = W + p.data.radius * p.data.blockSize * 2;
      drawPlanetWithCity(p, time);
    }
  }

  // ==================== SIGNATURE RINGED PLANET ====================
  function initSignaturePlanet() {
    signaturePlanet = { x: W + 200, y: H*0.35, speed: 3, radius: 45, phase: 0 };
    var r = 45, off = r * 2 + 2, bw = r * 4 + 4;
    var bc = document.createElement('canvas');
    bc.width = bw; bc.height = bw;
    var bx = bc.getContext('2d');
    bx.imageSmoothingEnabled = false;
    var palette = ['#f0f4f8','#dce4ee','#b8c4d4','#8a98a8','#5a6878','#384858','#1e2e3e'];
    for (var py = -r; py <= r; py++) {
      for (var px = -r; px <= r; px++) {
        var d = Math.sqrt(px*px+py*py);
        if (d > r) continue;
        var lit = Math.max(0, 1 - ((px*0.45+py*0.35)/(r*1.6)+0.5));
        var ci = Math.min(palette.length-1, Math.max(0, Math.floor(lit*(palette.length-1))));
        bx.fillStyle = palette[ci];
        bx.fillRect(Math.round(off+px*2), Math.round(off+py*2), 2, 2);
      }
    }
    for (var py = -r*0.75; py <= -r*0.05; py += 2) {
      for (var px = -r*0.7; px <= -r*0.05; px += 2) {
        var d2 = Math.sqrt(px*px+py*py);
        if (d2 > r*0.55) continue;
        var hl = 1 - d2/(r*0.55);
        bx.fillStyle = 'rgba(235,242,255,'+(0.25+hl*0.3)+')';
        bx.fillRect(Math.round(off+px*2), Math.round(off+py*2), 2, 2);
      }
    }
    for (var py = -r*0.3; py <= -r*0.15; py += 2) {
      for (var px = -r*0.25; px <= -r*0.1; px += 2) {
        var d3 = Math.sqrt(px*px+py*py);
        if (d3 > r*0.15) continue;
        bx.fillStyle = 'rgba(245,250,255,0.4)';
        bx.fillRect(Math.round(off+px*2), Math.round(off+py*2), 2, 2);
      }
    }
    var craters = [[-14,-10,7],[10,12,5],[-8,16,6],[16,-8,4],[4,18,4],[-16,6,4],[6,-14,3],[2,-18,3],[-20,-4,3]];
    for (var c = 0; c < craters.length; c++) {
      var crx = off+craters[c][0]*2, cry = off+craters[c][1]*2, crad = craters[c][2];
      for (var cpy = -crad; cpy <= crad; cpy++) {
        for (var cpx = -crad; cpx <= crad; cpx++) {
          if (cpx*cpx+cpy*cpy > crad*crad) continue;
          var dist = Math.sqrt(cpx*cpx+cpy*cpy);
          var shadowAngle = Math.atan2(cpy, cpx);
          var shadowFactor = Math.cos(shadowAngle - Math.PI*0.75);
          if (dist > crad*0.75) bx.fillStyle = 'rgba(25,35,50,'+(0.5+shadowFactor*0.25)+')';
          else if (dist > crad*0.45) bx.fillStyle = 'rgba(45,55,70,'+(0.35+shadowFactor*0.15)+')';
          else bx.fillStyle = 'rgba(30,40,55,0.25)';
          bx.fillRect(Math.round(crx+cpx*2), Math.round(cry+cpy*2), 2, 2);
        }
      }
    }
    signaturePlanet.bodyCanvas = bc;
    signaturePlanet.bodyOff = off;
  }
  function drawSignaturePlanet(time) {
    if (!signaturePlanet) return;
    var sp = signaturePlanet;
    sp.x -= sp.speed*0.016;
    if (sp.x < -sp.radius*3) { sp.x = W + sp.radius*3; sp.y = H*0.2+Math.random()*H*0.4; }
    var r = sp.radius;
    // Enhanced atmospheric glow halo — larger and more vivid
    var glowAlpha = 0.14 + 0.06*Math.sin(time*0.4);
    var atmosGrad = ctx.createRadialGradient(sp.x,sp.y,r*0.6,sp.x,sp.y,r*3.2);
    atmosGrad.addColorStop(0, 'rgba(170,190,230,'+glowAlpha+')');
    atmosGrad.addColorStop(0.25, 'rgba(140,160,210,'+(glowAlpha*0.7)+')');
    atmosGrad.addColorStop(0.55, 'rgba(110,130,190,'+(glowAlpha*0.3)+')');
    atmosGrad.addColorStop(0.8, 'rgba(90,110,170,'+(glowAlpha*0.1)+')');
    atmosGrad.addColorStop(1, 'rgba(80,100,160,0)');
    ctx.fillStyle = atmosGrad; ctx.beginPath(); ctx.arc(sp.x,sp.y,r*3.2,0,Math.PI*2); ctx.fill();
    // Back ring (behind planet) — drawn first so planet covers it
    var ringColors = ['#d8c8a8','#c8b898','#b8a888','#d0c0a0','#c0b090','#e0d0b0'];
    for (var a = 0; a < Math.PI*2; a += 0.06) {
      var rx = Math.cos(a)*r*2.8, ry = Math.sin(a)*r*0.6;
      var inBack = (ry < -2 && Math.cos(a) < 0.1);
      if (!inBack) continue;
      var shimmer = 0.4+0.2*Math.sin(a*3+time*0.4);
      ctx.fillStyle = ringColors[Math.floor((a/Math.PI*2)*ringColors.length)%ringColors.length];
      ctx.globalAlpha = shimmer;
      ctx.fillRect(Math.round(sp.x+rx)-1, Math.round(sp.y+ry)-1, 2, 2);
    }
    // Thin outer ring — back half
    for (var a = 0; a < Math.PI*2; a += 0.1) {
      var rx2 = Math.cos(a)*r*3.5, ry2 = Math.sin(a)*r*0.5;
      var inBack2 = (ry2 < -2 && Math.cos(a) < 0.1);
      if (!inBack2) continue;
      ctx.globalAlpha = 0.2;
      ctx.fillStyle = 'rgba(200,190,160,0.3)';
      ctx.fillRect(Math.round(sp.x+rx2)-1, Math.round(sp.y+ry2)-1, 2, 2);
    }
    // Planet body (pre-rendered offscreen)
    if (sp.bodyCanvas) ctx.drawImage(sp.bodyCanvas, Math.round(sp.x - sp.bodyOff), Math.round(sp.y - sp.bodyOff));
    // Main ring — front half (closer to viewer)
    for (var a = 0; a < Math.PI*2; a += 0.06) {
      var rx = Math.cos(a)*r*2.8, ry = Math.sin(a)*r*0.6;
      var inFront = (ry > -2 && Math.cos(a) > -0.15);
      if (!inFront) continue;
      var ri = Math.floor((a/Math.PI*2)*ringColors.length)%ringColors.length;
      var shimmer = 0.55+0.3*Math.sin(a*4+time*0.6);
      ctx.fillStyle = ringColors[ri];
      ctx.globalAlpha = shimmer;
      ctx.fillRect(Math.round(sp.x+rx)-1, Math.round(sp.y+ry)-1, 2, 2);
    }
    // Thin outer ring — front half
    for (var a = 0; a < Math.PI*2; a += 0.1) {

  function updateAndDrawShootingStars(dt, time) {

      if (s.life <= 0 || s.x < -80) { shootingStars.splice(i,1); continue; }
      var alpha = s.life/s.maxLife, steps = 20;
      for (var t = 0; t < steps; t++) {
        var tx = Math.round(s.x - s.vx*dt*(t/steps)*10), ty = Math.round(s.y - s.vy*dt*(t/steps)*10);
        var ta = alpha*(1-t/steps);
        if (t<2) {
          ctx.fillStyle = 'rgba(255,255,255,'+ta+')';
          ctx.fillRect(tx, ty, 2, 2);
        } else if (t<4) {
          ctx.fillStyle = 'rgba(230,220,255,'+(ta*0.8)+')';

 // ==================== ROCK PIXEL GENERATOR ====================
  // Pre-generates a layered rocky asteroid pattern with rim light and craters
  function generateRockPixels(w, h) {
    var pixels = [];
    var blockSize = 4;
    var cols = Math.ceil(w/blockSize), rows = Math.ceil(h/blockSize);
    // Palette: bright highlight → mid → shadow → crater
    var rockPalette = ['#a89888','#8a7a6a','#6a5a4a','#4a3e32','#3a2e22'];
    var craterPalette = ['#2a2018','#3a3028'];
    // Randomized outline for jagged shape
    var outline = [];
    for (var angle = 0; angle < Math.PI*2; angle += 0.15) {
      outline.push(0.55 + Math.random()*0.35);
    }
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var cx2 = c*blockSize+blockSize/2, cy2 = r*blockSize+blockSize/2;
        var nx = (cx2/w-0.5)*2, ny = (cy2/h-0.5)*2;
        var dist = Math.sqrt(nx*nx*0.8+ny*ny);
        if (dist > 1) continue;
        // Edge detection for jagged outline
        var ang = Math.atan2(ny, nx);
        var oi = Math.floor(((ang+Math.PI)/(Math.PI*2))*outline.length)%outline.length;
        if (dist > outline[oi]) continue;
        // Top-left rim light
        var rimLight = Math.max(0, 1 - ((nx*0.5+ny*0.5)*0.6+0.5));
        var ci = Math.floor(rimLight*(rockPalette.length-1));
        pixels.push({ dx:c*blockSize, dy:r*blockSize, color:rockPalette[ci] });
        // Scatter crater dots (darker spots)
        if (Math.random() < 0.12 && dist < 0.5) {
          pixels.push({ dx:c*blockSize, dy:r*blockSize, color:craterPalette[Math.floor(Math.random()*2)] });
        }
      }
    }
    return pixels;
  }

  // ==================== OBSTACLE DRAW FUNCTIONS ====================

  function drawMeteor(o) {

        for (var rx = -bodyW/2; rx < bodyW/2; rx += 4) {
          var nx = rx/(bodyW/2), ny = ry/(bodyH/2);
          var d = Math.sqrt(nx*nx+ny*ny);
          if (d > 0.9+Math.random()*0.15) continue;
          var lit = Math.max(0, 1-(nx*0.4+ny*0.3)+0.3);
          var color;
          if (lit > 0.65) color = '#9a8070';
          else if (lit > 0.4) color = '#6a5040';
          else if (lit > 0.2) color = '#4a3020';
          else color = '#2a1810';
          // Crater
          if (Math.random() < 0.08 && d < 0.5) color = 'rgba(20,10,5,0.6)';
          bodyPixels.push({ rx:rx, ry:ry, color:color });
        }
      }
      o.bodyPixels = bodyPixels;
    }
    for (var i = 0; i < bodyPixels.length; i++) {
      ctx.fillStyle = bodyPixels[i].color;
      ctx.fillRect(Math.round(bodyPixels[i].rx), Math.round(bodyPixels[i].ry), 4, 4);
    }
    // Animated multi-color pixel flame tail — enhanced flicker
    var t2 = performance.now()*0.006;
    var flamePalette = ['#ffcc00','#ffaa00','#ff8800','#ff5500','#ff2200','#cc2200'];
    for (var fi = 0; fi < 16; fi++) {
      var ft = t2+fi*0.6;

      var fy = bodyH/2+fi*(bodyH*0.5/16)+Math.sin(ft*1.4)*5;
      var fsize = Math.max(2, 12-fi*0.7);
      var fFlicker = 0.5+0.5*Math.sin(ft*2.3+fi*1.1);
      var fAlpha = Math.max(0.1, 0.85-fi*0.055)*fFlicker;

        ctx.fillRect(Math.round(fx-fsize/3), Math.round(fy-1), Math.round(fsize*0.7), Math.round(fsize*0.7));
      }
      ctx.fillStyle = flamePalette[fColorIdx];
      ctx.globalAlpha = fAlpha;
      ctx.fillRect(Math.round(fx-fsize/2), Math.round(fy), Math.round(fsize), Math.round(fsize));
    }
    // Bright core flame
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,200,0.8)';
    ctx.fillRect(Math.round(-2), Math.round(bodyH/2), 4, 4);

      ctx.fillRect(px-1, py-1, 2, 2);
    }
    ctx.fillStyle = 'rgba(10,0,20,0.85)';
    for (var dr = -4; dr <= 4; dr += 2) {
      for (var dc = -4; dc <= 4; dc += 2) {
        if (dr*dr+dc*dc <= 16) ctx.fillRect(dc, dr, 2, 2);
      }
    }
    ctx.restore();
  }

  // ==================== PLANET OBSTACLE DRAW FUNCTIONS ====================

  function initPlanetRunner() {
    planetObstacles = [];
    planetEnemies = [];
    planetSpawnTimer = 1.5;
    planetScrollSpeed = PLANET_SCROLL_BASE;
    laserBeams = [];
    planetStartTime = time;
  }

  function spawnPlanetObstacle() {
    const pool = getPlanetObstaclePool(difficultyMult);
    const type = pool[Math.floor(Math.random() * pool.length)];
    if (type === 'ENEMY') {
      planetEnemies.push({
        x: W + 30, y: CHAR_GROUND_Y - 50,
        w: 32, h: 50,
        hp: 2, speed: 60 + Math.random() * 40,
        shootTimer: 2 + Math.random() * 2,
        alive: true, bobOffset: Math.random() * Math.PI * 2
      });
      return;
    }
    const defs = {
      JUMP_ROCK:    { w: 44, h: 36, y: CHAR_GROUND_Y - 36, slideUnder: false },
      JUMP_PLANT:   { w: 30, h: 52, y: CHAR_GROUND_Y - 52, slideUnder: false },
      SLIDE_BRANCH: { w: 80, h: 28, y: CHAR_GROUND_Y - 100, slideUnder: true },
      SLIDE_GATE:   { w: 20, h: 70, y: CHAR_GROUND_Y - 70, slideUnder: true, passH: 40 },
    };
    const def = defs[type];
    if (!def) return;
    planetObstacles.push({ type, x: W + 20, y: def.y, w: def.w, h: def.h, slideUnder: def.slideUnder, passH: def.passH || 0 });
  }

  function getPlanetObstaclePool(diff) {
    const pool = ['JUMP_ROCK', 'JUMP_ROCK', 'JUMP_PLANT', 'SLIDE_BRANCH'];
    if (diff >= 1.3) pool.push('SLIDE_GATE', 'ENEMY');
    if (diff >= 1.6) pool.push('ENEMY', 'ENEMY');
    return pool;
  }

  function updatePlanetObstacles(dt) {
    planetScrollSpeed = Math.min(PLANET_SCROLL_BASE * difficultyMult, PLANET_SCROLL_BASE * 2.2);
    planetSpawnTimer -= dt;
    if (planetSpawnTimer <= 0) {
      spawnPlanetObstacle();
      planetSpawnTimer = Math.max(1.2, PLANET_SPAWN_INTERVAL_BASE / difficultyMult);
    }
    for (let i = planetObstacles.length - 1; i >= 0; i--) {
      const o = planetObstacles[i];
      o.x -= planetScrollSpeed * dt;
      if (o.x + o.w < 0) { planetObstacles.splice(i, 1); continue; }
      if (!o.scored && o.x + o.w < CHAR_X) { o.scored = true; score++; }
    }
    for (let i = planetEnemies.length - 1; i >= 0; i--) {
      const e = planetEnemies[i];
      if (!e.alive) { planetEnemies.splice(i, 1); continue; }
      e.x -= (planetScrollSpeed * 0.5 + e.speed) * dt;
      if (e.x + e.w < 0) { planetEnemies.splice(i, 1); continue; }
    }
  }

  function checkPlanetCollisions() {
    if (charInvincible > 0) { return; }
    if (char.state === 'death') return;
    const cx = CHAR_X, cy = char.y;
    const cw = char.isSliding ? char.hitW * 1.5 : char.hitW;
    const ch = char.isSliding ? char.hitH * 0.45 : char.hitH;
    for (const o of planetObstacles) {
      const ox = o.x + o.w * 0.5, oy = o.y + o.h * 0.5;
      const hw = (cw * 0.8 * 0.5) + (o.w * 0.75 * 0.5);
      const hh = (ch * 0.8 * 0.5) + (o.h * 0.75 * 0.5);
      if (Math.abs(cx - ox) < hw && Math.abs(cy - ch / 2 - oy) < hh) {
        if (o.slideUnder && char.isSliding) continue;
        takeDamagePlanet();
        return;
      }
    }
    for (let bi = laserBeams.length - 1; bi >= 0; bi--) {
      const b = laserBeams[bi];
      for (let i = planetEnemies.length - 1; i >= 0; i--) {
        const e = planetEnemies[i];
        if (!e.alive) continue;
        if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
          e.hp--;
          laserBeams.splice(bi, 1);
          if (e.hp <= 0) { e.alive = false; score += 5; spawnEnemyExplosion(e.x + e.w / 2, e.y + e.h / 2); }
          break;
        }
      }
    }
    for (const e of planetEnemies) {
      if (!e.alive) continue;
      if (Math.abs(cx - (e.x + e.w / 2)) < (cw / 2 + e.w / 2) * 0.8 && Math.abs((cy - ch / 2) - (e.y + e.h / 2)) < (ch / 2 + e.h / 2) * 0.8) {
        takeDamagePlanet();
        return;
      }
    }
  }

  function spawnEnemyExplosion(x, y) {
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 120;
      explosionParticles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, max: 0.6, color: '#ff8833' });
    }
  }

  function takeDamagePlanet() {
    if (charInvincible > 0 || char.state === 'death') return;
    lives--;
    charInvincible = 2.0;
    setCharState('hurt');
    playSound('hit');
    if (lives <= 0) {
      setCharState('death');
      setTimeout(() => { gameState = STATE.GAME_OVER; }, 1500);
    }
  }

  function drawPlanetObstacles(time) {
    if (!planetObstacles || planetObstacles.length === 0) return;
    ctx.save();
    ctx.imageSmoothingEnabled = false;

    for (const o of planetObstacles) {
      const ox = Math.round(o.x);
      const oy = Math.round(o.y);

      if (o.type === 'JUMP_ROCK') {
        ctx.fillStyle = '#6a5a48';
        ctx.fillRect(ox, oy, o.w, o.h);
        ctx.fillStyle = '#9a8a70';
        ctx.fillRect(ox + 2, oy + 2, o.w - 6, Math.floor(o.h * 0.4));
        ctx.fillStyle = '#3a2e20';
        ctx.fillRect(ox + Math.floor(o.w * 0.3), oy + 4, 2, Math.floor(o.h * 0.6));
        ctx.fillRect(ox + Math.floor(o.w * 0.6), oy + 8, 2, Math.floor(o.h * 0.5));
        ctx.fillStyle = '#ffaa33';
        ctx.fillRect(ox, oy, o.w, 3);
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(ox + 4, oy + o.h, o.w - 2, 5);

      } else if (o.type === 'JUMP_PLANT') {
        ctx.fillStyle = '#2a7a2a';
        ctx.fillRect(ox + Math.floor(o.w * 0.4), oy + Math.floor(o.h * 0.5), Math.floor(o.w * 0.2), Math.floor(o.h * 0.5));
        ctx.fillStyle = '#44cc44';
        ctx.fillRect(ox, oy, o.w, Math.floor(o.h * 0.55));
        ctx.fillStyle = '#88ff88';
        ctx.fillRect(ox + 4, oy + 3, o.w - 10, Math.floor(o.h * 0.2));
        ctx.fillStyle = `rgba(150,255,80,${0.6 + 0.4 * Math.sin(time * 4)})`;
        ctx.fillRect(ox + Math.floor(o.w * 0.3), oy - 4, Math.floor(o.w * 0.4), 6);
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(ox + 4, oy + o.h, o.w - 2, 5);

      } else if (o.type === 'SLIDE_BRANCH') {
        ctx.fillStyle = '#5a3a18';
        ctx.fillRect(ox, oy, o.w, o.h);
        ctx.fillStyle = '#336622';
        ctx.fillRect(ox, oy, o.w, 10);
        ctx.fillStyle = '#44aa33';
        ctx.fillRect(ox + 4, oy, o.w - 8, 6);
        ctx.fillStyle = '#2a5518';
        for (let v = 8; v < o.w - 8; v += 14) {
          const vlen = 8 + Math.floor(Math.sin(v + time * 2) * 4);
          ctx.fillRect(ox + v, oy + o.h, 3, vlen);
        }
        ctx.fillStyle = `rgba(255,240,50,${0.5 + 0.3 * Math.sin(time * 3)})`;
        ctx.fillRect(ox + Math.floor(o.w / 2) - 10, oy + o.h + 10, 20, 4);
        ctx.fillRect(ox + Math.floor(o.w / 2) - 6, oy + o.h + 14, 12, 3);
        ctx.fillRect(ox + Math.floor(o.w / 2) - 3, oy + o.h + 17, 6, 3);

      } else if (o.type === 'SLIDE_GATE') {
        ctx.fillStyle = '#334488';
        ctx.fillRect(ox, oy, o.w, o.h);
        const ep = 0.5 + 0.5 * Math.sin(time * 5);
        ctx.fillStyle = `rgba(80,180,255,${0.3 + ep * 0.4})`;
        ctx.fillRect(ox, oy, o.w, o.h);
        ctx.fillStyle = `rgba(150,220,255,${0.7 + ep * 0.3})`;
        ctx.fillRect(ox - 2, oy, 4, o.h);
        ctx.fillRect(ox + o.w - 2, oy, 4, o.h);
        ctx.fillStyle = '#aaddff';
        ctx.fillRect(ox - 3, oy, o.w + 6, 5);
      }
    }

    for (const e of planetEnemies) {
      if (!e.alive) continue;
      const bob = Math.sin(time * 3 + e.bobOffset) * 4;
      const ex = Math.round(e.x);
      const ey = Math.round(e.y + bob);
      ctx.fillStyle = '#cc2211';
      ctx.fillRect(ex, ey, e.w, e.h);
      ctx.fillStyle = '#ee4433';
      ctx.fillRect(ex + 4, ey + 4, e.w - 8, Math.floor(e.h * 0.35));
      ctx.fillStyle = '#ffdd00';
      ctx.fillRect(ex + Math.floor(e.w / 2) - 5, ey + 8, 10, 7);
      ctx.fillStyle = '#111';
      ctx.fillRect(ex + Math.floor(e.w / 2) - 3, ey + 10, 6, 5);
      for (let s = 0; s < 3; s++) {
        ctx.fillStyle = '#ff4422';
        ctx.fillRect(ex + 4 + s * 10, ey - 6, 5, 8);
      }
      ctx.fillStyle = '#550000';
      ctx.fillRect(ex, ey - 10, e.w, 5);
      ctx.fillStyle = '#ff3300';
      ctx.fillRect(ex, ey - 10, Math.round(e.w * (e.hp / 2)), 5);
    }

    ctx.restore();
  }

  function drawPlanetHUD() {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, 36);
    ctx.fillStyle = '#00eeff';
    ctx.font = 'bold 14px Orbitron, monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE: ' + String(score).padStart(5, '0'), 10, 24);
    ctx.textAlign = 'center';
    ctx.fillText('VERDANT JUNGLE', W / 2, 24);
    ctx.textAlign = 'right';
    ctx.fillText('\u2665'.repeat(lives), W - 10, 24);
    // Brief controls reminder for the first few seconds on the planet.
    if (time - planetStartTime < 5) {
      ctx.globalAlpha = Math.max(0, 1 - (time - planetStartTime - 3.5) / 1.5);
      ctx.fillStyle = '#cfe9ff';
      ctx.font = '10px Orbitron, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('TAP / \u2191 JUMP   \u2193 SLIDE   \u2192 SHOOT', W / 2, H - 14);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
